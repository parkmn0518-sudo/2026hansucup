<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2026 한수컵</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --navy:#1a2a5e;--navy-light:#253a7a;--gold:#c9952a;--gold-light:#f0c050;
  --white:#fff;--bg:#f4f5f8;--card:#fff;--text:#1a1a2e;--text2:#4a5580;--border:#d8dce8;
  --win:#16a34a;--radius:10px;--max:860px;
  --futsal-bg:#dbeafe;--futsal-text:#1e3a8a;--futsal-border:#93c5fd;
  --tchouk-bg:#dcfce7;--tchouk-text:#14532d;--tchouk-border:#86efac;
  --volley-bg:#fef9c3;--volley-text:#713f12;--volley-border:#fde047;
  --special-bg:#f3e8ff;--special-text:#6b21a8;
  --general-bg:#e0e4f0;--general-text:#1a2a5e;
}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}
.top-banner{background:var(--navy);position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.3);}
.banner-inner{max-width:var(--max);margin:0 auto;padding:0 16px;height:88px;display:flex;align-items:center;gap:12px;}
.logo-trophy{font-size:36px;}
.logo-texts .logo-main{color:var(--white);font-size:18px;font-weight:900;}
.logo-texts .logo-sub{color:var(--gold-light);font-size:11px;font-weight:500;}
.banner-spacer{flex:1;}
.weather-box{display:flex;flex-direction:column;align-items:center;gap:2px;flex-shrink:0;}
.weather-top{display:flex;align-items:center;gap:6px;}
.weather-icon{font-size:28px;}
.weather-temp{font-family:'Bebas Neue',sans-serif;font-size:26px;color:var(--white);}
.weather-desc{font-size:10px;color:rgba(255,255,255,.7);}
.weather-date{font-size:10px;color:var(--gold-light);white-space:nowrap;}
.nav-bar{background:var(--navy-light);border-top:1px solid rgba(255,255,255,.1);position:sticky;top:88px;z-index:99;}
.nav-inner{max-width:var(--max);margin:0 auto;padding:0 8px;height:50px;display:flex;align-items:center;gap:1px;overflow-x:auto;scrollbar-width:none;}
.nav-inner::-webkit-scrollbar{display:none;}
.nav-tab{padding:8px 14px;border-radius:6px;color:rgba(255,255,255,.65);font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;border:none;background:none;transition:all .15s;flex-shrink:0;}
.nav-tab:hover{color:var(--white);background:rgba(255,255,255,.12);}
.nav-tab.active{color:var(--gold-light);background:rgba(201,149,42,.28);font-weight:700;}
.admin-btn{margin-left:auto;padding:7px 13px;border-radius:6px;border:1px solid var(--gold);color:var(--gold-light);font-size:12px;font-weight:700;background:none;cursor:pointer;white-space:nowrap;flex-shrink:0;display:none;}
.admin-btn.active-admin{background:var(--gold);color:var(--navy);}
.teacher-badge{display:none;background:#16a34a;color:#fff;font-size:10px;font-weight:700;padding:3px 8px;border-radius:10px;flex-shrink:0;}
.page{display:none;padding:14px 14px 40px;max-width:var(--max);margin:0 auto;}
.page.active{display:block;}
.section-title{font-size:14px;font-weight:700;color:var(--navy);margin:16px 0 8px;padding-left:9px;border-left:3px solid var(--gold);}
/* STATS */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
.stat-card{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);padding:12px 8px;text-align:center;}
.stat-card .num{font-size:26px;font-weight:700;color:var(--navy);font-family:'Bebas Neue',sans-serif;line-height:1;}
.stat-card .lbl{font-size:11px;color:var(--text2);margin-top:2px;}
.stat-card.done-card .num{color:var(--win);}
/* SPORT CARDS */
.sport-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:4px;}
.sport-card{border-radius:var(--radius);border:2px solid;padding:12px 6px;text-align:center;cursor:pointer;}
.sport-card.futsal{background:var(--futsal-bg);border-color:var(--futsal-border);}
.sport-card.tchouk{background:var(--tchouk-bg);border-color:var(--tchouk-border);}
.sport-card.volleyball{background:var(--volley-bg);border-color:var(--volley-border);}
.sport-card .s-icon{font-size:24px;}
.sport-card .s-grade{font-size:13px;font-weight:700;margin-top:4px;}
.sport-card.futsal .s-grade,.sport-card.futsal .s-sport{color:var(--futsal-text);}
.sport-card.tchouk .s-grade,.sport-card.tchouk .s-sport{color:var(--tchouk-text);}
.sport-card.volleyball .s-grade,.sport-card.volleyball .s-sport{color:var(--volley-text);}
.sport-card .s-sport{font-size:11px;}
/* OVERVIEW */
.overview-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:4px;}
.overview-header{background:var(--navy);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;}
.overview-title{font-size:13px;font-weight:700;color:var(--white);}
.overview-edit-btn{padding:4px 10px;background:rgba(255,255,255,.15);color:var(--white);border:1px solid rgba(255,255,255,.3);border-radius:5px;font-size:11px;font-weight:700;cursor:pointer;display:none;}
.overview-body{padding:12px 14px;}
.overview-row{display:flex;gap:8px;margin-bottom:6px;font-size:13px;}
.overview-key{font-weight:700;color:var(--navy);min-width:44px;flex-shrink:0;}
.overview-edit-area{display:none;padding:10px 14px;border-top:1px solid var(--border);background:#f8f9fc;}
.overview-edit-area textarea{width:100%;padding:8px 10px;border:1.5px solid var(--navy);border-radius:6px;font-size:12px;font-family:'Noto Sans KR',sans-serif;resize:vertical;min-height:100px;}
.ov-actions{display:flex;gap:6px;justify-content:flex-end;margin-top:6px;}
.btn-sm{padding:5px 12px;border:none;border-radius:5px;font-size:11px;font-weight:700;cursor:pointer;}
.btn-navy{background:var(--navy);color:var(--white);}
.btn-gray{background:var(--bg);color:var(--text2);}
/* NOTICE (HOME) */
.notice-card-home{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.notice-home-header{background:var(--navy);padding:9px 14px;display:flex;align-items:center;justify-content:space-between;}
.notice-home-title{font-size:13px;font-weight:700;color:var(--white);}
.notice-home-list{padding:6px 8px;}
.notice-home-item{padding:8px 9px;border-radius:6px;cursor:pointer;}
.notice-home-item:hover{background:#f0f2f8;}
.notice-item-title{font-size:12px;font-weight:700;color:var(--text);}
.notice-item-meta{font-size:10px;color:var(--text2);margin-top:2px;}
/* CALENDAR */
.cal-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.cal-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--navy);}
.cal-nav-btn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:var(--white);border-radius:5px;width:30px;height:30px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.cal-month-title{font-family:'Bebas Neue',sans-serif;font-size:19px;color:var(--gold-light);}
.cal-add-btn{padding:4px 10px;background:var(--gold);color:var(--navy);border:none;border-radius:5px;font-size:11px;font-weight:700;cursor:pointer;display:none;}
.cal-day-names{display:grid;grid-template-columns:repeat(7,1fr);background:#f0f2f8;}
.cal-dn{text-align:center;padding:5px 0;font-size:10px;font-weight:700;color:var(--text2);}
.cal-dn:first-child{color:#dc2626;}.cal-dn:last-child{color:#2563eb;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);}
.cal-cell{min-height:60px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:3px;position:relative;}
.cal-cell:nth-child(7n){border-right:none;}
.cal-cell.empty{background:#f9fafb;}
.cal-cell.today{background:#fffbf0;}
.cal-date{width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--text);border-radius:50%;}
.cal-cell.today .cal-date{background:var(--navy);color:var(--white);}
.cal-cell.sun .cal-date{color:#dc2626;}.cal-cell.sat .cal-date{color:#2563eb;}
.cal-event{font-size:9px;padding:1px 3px;border-radius:3px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;}
.ev-futsal{background:var(--futsal-bg);color:var(--futsal-text);}
.ev-tchouk{background:var(--tchouk-bg);color:var(--tchouk-text);}
.ev-volleyball{background:var(--volley-bg);color:var(--volley-text);}
.ev-special{background:var(--special-bg);color:var(--special-text);}
.ev-general{background:var(--general-bg);color:var(--general-text);}
.cal-more{font-size:8px;color:var(--text2);}
.ev-del-btn{display:none;background:#fee2e2;color:#991b1b;border:none;border-radius:2px;font-size:8px;cursor:pointer;padding:0 2px;}
.admin-cal .ev-del-btn{display:inline;}
.cal-add-cell-btn{display:none;position:absolute;bottom:1px;right:1px;background:none;border:none;color:#c0c8e0;font-size:14px;cursor:pointer;padding:0;}
.admin-cal .cal-add-cell-btn{display:block;}
.cal-legend{display:flex;gap:8px;flex-wrap:wrap;padding:7px 12px;border-top:1px solid var(--border);background:#f9fafb;}
.leg-item{display:flex;align-items:center;gap:3px;font-size:10px;color:var(--text2);}
.leg-dot{width:9px;height:9px;border-radius:2px;}
/* BRACKET */
.bracket-header{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.grade-badge,.sport-badge{padding:5px 14px;border-radius:20px;font-size:13px;font-weight:700;}
.grade-badge.futsal{background:var(--futsal-bg);color:var(--futsal-text);border:1px solid var(--futsal-border);}
.grade-badge.tchouk{background:var(--tchouk-bg);color:var(--tchouk-text);border:1px solid var(--tchouk-border);}
.grade-badge.volleyball{background:var(--volley-bg);color:var(--volley-text);border:1px solid var(--volley-border);}
.sport-badge.futsal{background:var(--futsal-text);color:#fff;}
.sport-badge.tchouk{background:var(--tchouk-text);color:#fff;}
.sport-badge.volleyball{background:var(--volley-text);color:#fff;}
.bracket-wrap{overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch;}
.round-col-grid{display:grid;grid-template-columns:repeat(5,minmax(158px,1fr));align-items:start;}
.round-col-label{text-align:center;font-size:11px;font-weight:700;padding:5px 7px;border-radius:6px 6px 0 0;margin:0 4px;}
.round-col-label.futsal{background:var(--futsal-text);color:#fff;}
.round-col-label.tchouk{background:var(--tchouk-text);color:#fff;}
.round-col-label.volleyball{background:var(--volley-text);color:#fff;}
.match-node{background:var(--card);border:1.5px solid var(--border);border-radius:7px;margin:4px;overflow:hidden;}
.match-node.futsal-node{border-color:var(--futsal-border);}
.match-node.tchouk-node{border-color:var(--tchouk-border);}
.match-node.volleyball-node{border-color:var(--volley-border);}
.match-top{border-bottom:1px solid var(--border);padding:4px 7px;}
.match-top.futsal{background:var(--futsal-bg);}
.match-top.tchouk{background:var(--tchouk-bg);}
.match-top.volleyball{background:var(--volley-bg);}
.match-round-row{display:flex;align-items:center;justify-content:space-between;}
.match-round-label{font-size:10px;font-weight:700;}
.match-round-label.futsal{color:var(--futsal-text);}
.match-round-label.tchouk{color:var(--tchouk-text);}
.match-round-label.volleyball{color:var(--volley-text);}
.match-status-pill{font-size:9px;font-weight:700;padding:1px 6px;border-radius:8px;}
.pill-scheduled{background:#e0e4f0;color:var(--navy);}
.pill-done{background:#dcfce7;color:#14532d;}
.match-date-row{font-size:9px;color:var(--text2);margin-top:2px;}
.team-row{display:flex;align-items:center;padding:8px 9px;border-bottom:1px solid var(--border);}
.team-row:last-of-type{border-bottom:none;}
.team-row.winner{background:#f0fdf4;}
.team-row.loser{opacity:.5;}
.team-nm{font-size:13px;font-weight:700;flex:1;}
.team-sc{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--navy);min-width:20px;text-align:right;line-height:1;}
.team-sc.win-sc{color:var(--win);}
.staff-row{font-size:9px;color:var(--text2);padding:2px 7px;background:#f8f9fc;border-bottom:1px solid var(--border);}
.edit-panel{background:#f8f9fc;border-top:1px solid var(--border);padding:9px 10px;display:none;flex-direction:column;gap:6px;}
.edit-panel.open{display:flex;}
.edit-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.edit-lbl{font-size:11px;color:var(--text2);min-width:26px;}
.inp-team{flex:1;min-width:70px;padding:5px 7px;border:1.5px solid var(--navy);border-radius:5px;font-size:12px;font-family:'Noto Sans KR',sans-serif;}
.inp-date{flex:1;padding:5px 7px;border:1.5px solid var(--navy);border-radius:5px;font-size:12px;}
.inp-sc{width:48px;padding:5px;border:1.5px solid var(--navy);border-radius:5px;font-size:14px;font-weight:700;text-align:center;}
.sel-st{padding:5px 6px;border:1.5px solid var(--navy);border-radius:5px;font-size:11px;font-family:'Noto Sans KR',sans-serif;}
.edit-divider{font-size:10px;color:var(--text2);font-weight:700;border-top:1px solid var(--border);padding-top:5px;}
.save-btn{padding:6px 14px;background:var(--navy);color:var(--white);border:none;border-radius:5px;font-size:11px;font-weight:700;cursor:pointer;}
.edit-btn-small{padding:3px 7px;background:none;border:1px solid var(--navy);border-radius:4px;font-size:10px;color:var(--navy);cursor:pointer;}
.podium-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
.podium-card{border-radius:var(--radius);border:2px solid var(--border);padding:10px 6px;text-align:center;}
.podium-card.gold-b{border-color:var(--gold);}
.podium-name{font-size:15px;font-weight:700;color:var(--navy);}
.podium-lbl{font-size:10px;color:var(--text2);margin-top:2px;}
/* SCHEDULE */
.round-block{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px;overflow:hidden;}
.round-block-header{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;cursor:pointer;user-select:none;}
.round-block-header:active{background:#f0f2f8;}
.rnd-title-row{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--navy);}
.rsb{font-size:10px;padding:2px 7px;border-radius:10px;font-weight:700;}
.rsb-done{background:#dcfce7;color:#14532d;}
.rsb-sched{background:#e0e4f0;color:var(--navy);}
.rnd-toggle{font-size:11px;color:var(--text2);transition:transform .2s;}
.rnd-toggle.open{transform:rotate(180deg);}
.rnd-body{display:none;padding:0 10px 10px;}
.rnd-body.open{display:block;}
.sched-table{width:100%;border-collapse:collapse;font-size:11px;}
.sched-table th{padding:6px 7px;text-align:center;font-weight:700;font-size:10px;color:#fff;}
.th-futsal{background:var(--futsal-text);}
.th-tchouk{background:var(--tchouk-text);}
.th-volleyball{background:var(--volley-text);}
.sched-table td{padding:7px 6px;text-align:center;border-bottom:1px solid var(--border);font-size:11px;}
.sched-table tr:last-child td{border-bottom:none;}
.vs-cell{font-weight:700;}
.admin-bar{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;}
.add-game-btn{padding:5px 12px;background:var(--navy);color:#fff;border:none;border-radius:5px;font-size:11px;font-weight:700;cursor:pointer;}
.del-round-btn{padding:5px 9px;background:#fee2e2;color:#991b1b;border:none;border-radius:5px;font-size:10px;font-weight:700;cursor:pointer;}
.add-round-btn{padding:6px 14px;border:none;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;margin-top:4px;}
.add-round-btn.futsal{background:var(--futsal-bg);color:var(--futsal-text);}
.add-round-btn.tchouk{background:var(--tchouk-bg);color:var(--tchouk-text);}
.add-round-btn.volleyball{background:var(--volley-bg);color:var(--volley-text);}
.del-game-btn{padding:2px 6px;background:#fee2e2;color:#991b1b;border:none;border-radius:3px;font-size:9px;font-weight:700;cursor:pointer;}
.edit-game-btn{padding:2px 6px;background:#e0e4f0;color:var(--navy);border:none;border-radius:3px;font-size:9px;font-weight:700;cursor:pointer;}
/* RULES */
.rules-tabs{display:flex;gap:5px;margin-bottom:12px;flex-wrap:wrap;}
.rules-tab{padding:7px 14px;border-radius:var(--radius);border:1.5px solid var(--navy);color:var(--navy);font-size:13px;font-weight:700;background:none;cursor:pointer;}
.rules-tab.active{background:var(--navy);color:#fff;}
.rules-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;display:none;}
.rules-card.active{display:block;}
.rules-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px;}
.rules-card-title{font-size:14px;font-weight:700;color:var(--navy);}
.rules-edit-btn{padding:4px 11px;background:#e0e4f0;color:var(--navy);border:none;border-radius:5px;font-size:11px;font-weight:700;cursor:pointer;display:none;}
.rules-content{font-size:13px;line-height:1.9;white-space:pre-wrap;}
.rules-edit-area{display:none;flex-direction:column;gap:7px;}
.rules-edit-area.open{display:flex;}
.rules-title-inp{width:100%;padding:7px 9px;border:1.5px solid var(--navy);border-radius:5px;font-size:13px;font-weight:700;font-family:'Noto Sans KR',sans-serif;}
.rules-body-ta{width:100%;padding:8px 9px;border:1.5px solid var(--navy);border-radius:5px;font-size:12px;font-family:'Noto Sans KR',sans-serif;resize:vertical;min-height:180px;line-height:1.9;}
.rules-actions{display:flex;gap:6px;justify-content:flex-end;}
/* BOARD */
.board-page{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:540px){.board-page{grid-template-columns:1fr;}}
.board-col{display:flex;flex-direction:column;gap:10px;}
.board-section{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.board-hdr{background:var(--navy);padding:9px 12px;display:flex;align-items:center;justify-content:space-between;}
.board-hdr.gold{background:var(--gold);}
.board-hdr-title{font-size:13px;font-weight:700;color:#fff;}
.board-hdr.gold .board-hdr-title{color:var(--navy);}
.write-btn{padding:4px 9px;background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:4px;font-size:11px;font-weight:700;cursor:pointer;}
.board-hdr.gold .write-btn{background:rgba(26,42,94,.12);color:var(--navy);border-color:rgba(26,42,94,.25);}
.post-list-inner{padding:7px;}
.post-item{padding:8px 9px;border-radius:6px;border:1px solid transparent;margin-bottom:3px;}
.post-item:hover{background:#f0f2f8;border-color:var(--border);}
.post-title-sm{font-size:12px;font-weight:700;cursor:pointer;}
.post-meta-sm{font-size:10px;color:var(--text2);margin-top:2px;display:flex;gap:7px;align-items:center;flex-wrap:wrap;}
.post-badge{font-size:9px;padding:1px 6px;border-radius:7px;font-weight:700;background:#e0e4f0;color:var(--navy);}
.empty-msg{font-size:12px;color:var(--text2);padding:14px;text-align:center;}
.post-actions{display:none;gap:3px;margin-left:auto;}
.post-actions.show{display:flex;}
.act-btn{padding:2px 7px;border-radius:3px;font-size:9px;font-weight:700;cursor:pointer;border:none;}
.act-edit{background:#e0e4f0;color:var(--navy);}
.act-del{background:#fee2e2;color:#991b1b;}
.pagination{display:flex;align-items:center;gap:4px;justify-content:center;padding:6px 0 2px;}
.pg-btn{padding:4px 9px;border:1px solid var(--border);border-radius:5px;font-size:11px;cursor:pointer;background:var(--card);}
.pg-btn.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.pg-btn:disabled{opacity:.4;cursor:default;}
/* INFO CARDS */
.info-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.info-card-hdr{padding:9px 12px;display:flex;align-items:center;gap:7px;justify-content:space-between;}
.info-card-hdr.safety{background:#fef3c7;}
.info-card-hdr.award{background:#dcfce7;}
.info-card-hdr.emergency{background:#fee2e2;}
.info-hdr-left{display:flex;align-items:center;gap:7px;}
.info-icon{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;}
.info-icon.safety{background:#f59e0b;}
.info-icon.award{background:#16a34a;}
.info-icon.emergency{background:#dc2626;}
.info-card-title{font-size:12px;font-weight:700;}
.info-card-title.safety{color:#92400e;}
.info-card-title.award{color:#14532d;}
.info-card-title.emergency{color:#991b1b;}
.info-edit-btn{padding:3px 8px;border-radius:4px;font-size:10px;font-weight:700;cursor:pointer;border:none;display:none;}
.info-edit-btn.safety{background:#fde68a;color:#92400e;}
.info-edit-btn.award{background:#bbf7d0;color:#14532d;}
.info-edit-btn.emergency{background:#fecaca;color:#991b1b;}
.info-body{padding:10px 12px;}
.info-item{display:flex;gap:7px;margin-bottom:6px;font-size:12px;line-height:1.7;}
.info-item:last-child{margin-bottom:0;}
.info-bullet{width:17px;height:17px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;margin-top:1px;}
.info-bullet.safety{background:#fde68a;color:#92400e;}
.info-bullet.award{background:#bbf7d0;color:#14532d;}
.info-bullet.emergency{background:#fecaca;color:#991b1b;}
.award-table{width:100%;border-collapse:collapse;font-size:11px;}
.award-table th{background:#f0f9f4;color:#14532d;padding:5px 8px;text-align:left;font-weight:700;border-bottom:1px solid #d1fae5;}
.award-table td{padding:5px 8px;border-bottom:1px solid var(--border);}
.info-edit-area{display:none;padding:9px 12px;border-top:1px solid var(--border);background:#f8f9fc;}
.info-edit-area.open{display:block;}
.info-edit-area textarea{width:100%;padding:7px 9px;border:1.5px solid var(--navy);border-radius:5px;font-size:12px;font-family:'Noto Sans KR',sans-serif;resize:vertical;min-height:90px;}
.info-hint{font-size:10px;color:var(--text2);margin-bottom:5px;}
.info-edit-actions{display:flex;gap:5px;justify-content:flex-end;margin-top:5px;}
/* WARNING */
.board-warning{background:#fff8e1;border-left:3px solid #f59e0b;padding:8px 12px;font-size:11px;color:#92400e;line-height:1.6;}
/* MODAL */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;align-items:flex-end;justify-content:center;padding:0;}
@media(min-width:540px){.modal-bg{align-items:center;padding:16px;}}
.modal-bg.show{display:flex;}
.modal{background:var(--card);border-radius:14px 14px 0 0;padding:20px 18px;width:100%;max-width:480px;max-height:92vh;overflow-y:auto;}
@media(min-width:540px){.modal{border-radius:12px;}}
.modal h2{font-size:15px;font-weight:700;color:var(--navy);margin-bottom:12px;}
.modal input,.modal textarea,.modal select{width:100%;padding:9px 10px;border:1.5px solid var(--border);border-radius:6px;font-size:14px;font-family:'Noto Sans KR',sans-serif;margin-bottom:8px;background:#fff;}
.modal input:focus,.modal textarea:focus{outline:none;border-color:var(--navy);}
.modal label{font-size:11px;color:var(--text2);display:block;margin-bottom:3px;font-weight:600;}
.modal-score-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
.modal-score-row input{margin-bottom:0;}
.modal-btns{display:flex;gap:7px;justify-content:flex-end;margin-top:6px;}
.modal-btns button{padding:9px 16px;border-radius:7px;font-size:13px;font-weight:700;cursor:pointer;border:none;}
.btn-cancel{background:var(--bg);color:var(--text);}
.btn-confirm{background:var(--navy);color:#fff;}
.btn-danger{background:#fee2e2;color:#991b1b;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:700;z-index:300;display:none;white-space:nowrap;}
</style>

<script>
var TEACHER_MODE = (new URLSearchParams(window.location.search).get('teacher') === 'hansu2026');
var isAdmin = false;

var gradeInfo = {
  1: {name:'1학년', sport:'풋살', icon:'⚽', cls:'futsal', evType:'ev-futsal', schedLabel:'1학년 풋살 경기 일정'},
  2: {name:'2학년', sport:'츄크볼', icon:'🤾', cls:'tchouk', evType:'ev-tchouk', schedLabel:'2학년 츄크볼 경기 일정'},
  3: {name:'3학년', sport:'배구', icon:'🏐', cls:'volleyball', evType:'ev-volleyball', schedLabel:'3학년 배구 경기 일정'}
};

/* ── 날씨 ── */
var DAYS_KO = ['일','월','화','수','목','금','토'];
var WI = {0:'☀️',1:'🌤️',2:'⛅',3:'🌥️',45:'🌫️',51:'🌦️',61:'🌧️',71:'🌨️',80:'🌦️',95:'⛈️'};
function setDateDisplay() {
  var now = new Date();
  document.getElementById('wDate').textContent =
    now.getFullYear()+'년 '+(now.getMonth()+1)+'월 '+now.getDate()+'일 '+DAYS_KO[now.getDay()]+'요일';
}
function fetchWeather() {
  setDateDisplay();
  fetch('https://api.open-meteo.com/v1/forecast?latitude=37.6549&longitude=127.2114&current=temperature_2m,weather_code&timezone=Asia%2FSeoul')
    .then(function(r){return r.json();})
    .then(function(d){
      document.getElementById('wTemp').textContent = Math.round(d.current.temperature_2m)+'°';
      document.getElementById('wIcon').textContent = WI[d.current.weather_code]||'🌤️';
      var desc = {0:'맑음',1:'대체로맑음',2:'구름조금',3:'흐림',45:'안개',51:'이슬비',61:'비',71:'눈',80:'소나기',95:'천둥번개'};
      document.getElementById('wDesc').textContent = desc[d.current.weather_code]||'--';
    })
    .catch(function(){document.getElementById('wDesc').textContent='날씨 오류';});
}
fetchWeather();
setInterval(function(){fetchWeather();setDateDisplay();}, 600000);

/* ── 행사 개요 ── */
var overviewData = [
  '일시|2026년 5월 19일 ~ 6월 13일',
  '장소|체육관',
  '대상|전교생 (1~3학년 각 10반)',
  '종목|1학년 풋살, 2학년 츄크볼, 3학년 배구',
  '방식|학년별 10반 토너먼트 (총 9경기)',
  '주관|한수중학교 체육부'
];
function renderOverview() {
  var el = document.getElementById('overviewBody');
  if (!el) return;
  el.innerHTML = overviewData.map(function(row) {
    var i = row.indexOf('|');
    return '<div class="overview-row"><span class="overview-key">'+row.substring(0,i)+'</span><span>'+row.substring(i+1)+'</span></div>';
  }).join('');
  var eb = document.getElementById('overviewEditBtn');
  if (eb) eb.style.display = isAdmin ? 'block' : 'none';
}
function toggleOverviewEdit() {
  var a = document.getElementById('overviewEditArea');
  if (a.classList.contains('open')) { a.classList.remove('open'); return; }
  document.getElementById('overviewEditText').value = overviewData.join('\n');
  a.classList.add('open');
}
function cancelOverviewEdit() { document.getElementById('overviewEditArea').classList.remove('open'); }
function saveOverviewEdit() {
  overviewData = document.getElementById('overviewEditText').value.trim().split('\n').map(function(s){return s.trim();}).filter(function(s){return s && s.indexOf('|')>-1;});
  renderOverview();
  document.getElementById('overviewEditArea').classList.remove('open');
  save('overview');
  showToast('행사개요 저장됨!');
}

/* ── 달력 ── */
var calYear = 2026, calMonth = 4;
var calManualEvents = [{id:1,date:'2026-06-13',title:'한수컵 시상식',type:'ev-special',note:'강당',auto:false}];
var nextCalId = 20;
var MONTHS = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];

function getAllCalEvents() {
  var auto = [];
  [1,2,3].forEach(function(g) {
    var info = gradeInfo[g];
    (schedules[g]||[]).forEach(function(rnd, ri) {
      rnd.games.forEach(function(gm, gi) {
        if (!gm.date) return;
        var timeLabel = gm.time ? gm.time+' ' : '';
        var label = timeLabel + (gm.home||'TBD') + ' vs ' + (gm.away||'TBD');
        auto.push({id:'a_'+g+'_'+ri+'_'+gi, date:gm.date, title:label, type:info.evType, note:info.sport, auto:true, g:g, ri:ri, gi:gi});
      });
    });
  });
  return calManualEvents.concat(auto);
}

function renderCalendar() {
  var allEv = getAllCalEvents();
  var today = new Date();
  var todayStr = today.getFullYear()+'-'+pad(today.getMonth()+1)+'-'+pad(today.getDate());
  var fd = new Date(calYear, calMonth, 1).getDay();
  var dim = new Date(calYear, calMonth+1, 0).getDate();
  var evMap = {};
  allEv.forEach(function(ev) {

  });

    }).join('');

    var addBtn = '<button class="cal-add-cell-btn" onclick="openAddCalEvent(\''+ds+'\')" title="추가">+</button>';
    cells += '<div class="'+cls+'">'+addBtn+'<div class="cal-date">'+d+'</div>'+evHtml+more+'</div>';

  var addBtnHdr = isAdmin ? '<button class="cal-add-btn" style="display:block" onclick="openAddCalEvent(\'\')">+ 추가</button>' : '';

    +'</div>'
    +'<div class="cal-day-names">'+['일','월','화','수','목','금','토'].map(function(d){return '<div class="cal-dn">'+d+'</div>';}).join('')+'</div>'
    +'<div class="cal-grid">'+cells+'</div>'
    +'<div class="cal-legend">'
    +'<div class="leg-item"><div class="leg-dot ev-futsal"></div>풋살</div>'
    +'<div class="leg-item"><div class="leg-dot ev-tchouk"></div>츄크볼</div>'
    +'<div class="leg-item"><div class="leg-dot ev-volleyball"></div>배구</div>'

/* ── 경기일정 → 대진표 동기화 ── */
function syncSchedToBracket(g, gm, ri, gi) {
  var rndName = schedules[g][ri].roundName;
  var R = tournaments[g].rounds;
  var map = {'1라운드':R.r1,'8강':R.qf,'4강':R.sf,'3·4위전':R.third,'결승전':R.final};
  var arr = map[rndName];
  if (!arr || gi >= arr.length) return;
  var bm = arr[gi];
  if (!bm) return;
  if (gm.date) bm.date = gm.date;
  if (gm.home && gm.home!=='TBD') { if (!bm.home) bm.home={id:gi+1,name:gm.home}; else bm.home.name=gm.home; }
  if (gm.away && gm.away!=='TBD') { if (!bm.away) bm.away={id:gi+1,name:gm.away}; else bm.away.name=gm.away; }
  bm.teacher  = gm.teacher  || bm.teacher  || '';
  bm.referee  = gm.referee  || bm.referee  || '';
  if (gm.homeScore!==null && gm.homeScore!==undefined) {
    bm.homeScore = +gm.homeScore;
    bm.awayScore = +gm.awayScore;
    bm.status    = gm.status==='완료' ? 'done' : 'scheduled';
    if (bm.status==='done') {
      bm.winner = bm.homeScore>bm.awayScore ? bm.home : (bm.awayScore>bm.homeScore ? bm.away : null);
    } else {
      bm.winner = null;
    }
    propagate(g);
  }
}

/* ── 대진표 → 경기일정 동기화 ── */
function syncBracketToSched(g, bm, matchId) {
  var parts = matchId.split('_');
  var rndKey = parts[1];
  var gi = +parts[2];
  var nameMap = {r1:'1라운드',qf:'8강',sf:'4강',third:'3·4위전',final:'결승전'};
  var rndName = nameMap[rndKey];
  if (!rndName || !schedules[g]) return;
  var ri = -1;
  schedules[g].forEach(function(r,i){ if(r.roundName===rndName) ri=i; });
  if (ri<0 || !schedules[g][ri].games[gi]) return;
  var gm = schedules[g][ri].games[gi];
  if (bm.date) gm.date = bm.date;
  if (bm.home && bm.home.name!=='TBD') gm.home = bm.home.name;
  if (bm.away && bm.away.name!=='TBD') gm.away = bm.away.name;
  if (bm.teacher!==undefined) gm.teacher = bm.teacher;
  if (bm.referee!==undefined) gm.referee = bm.referee;
  if (bm.homeScore!==null && bm.homeScore!==undefined) {
    gm.homeScore = bm.homeScore;
    gm.awayScore = bm.awayScore;
    gm.status    = bm.status==='done' ? '완료' : '예정';
  }
}

      +'<th class="'+thC+'">메모</th><th class="'+thC+'">교사</th><th class="'+thC+'">심판</th>'
      +(isAdmin?'<th class="'+thC+'">관리</th>':'')
      +'</tr></thead>';
    html += '<div class="round-block">'
      +'<div class="round-block-header" onclick="toggleRound(this)">'
      +'<div class="rnd-title-row"><span>'+rnd.roundName+'</span>'

      +'<span style="font-size:10px;color:var(--text2);font-weight:400">'+rnd.games.length+'경기</span></div>'

      +'<table class="sched-table">'+thead+'<tbody>'+rows+'</tbody></table>'
      +'</div>'+adminBar+'</div></div>';
  });
  if (isAdmin) {
    html += '<button class="add-round-btn '+cls+'" onclick="openAddRound('+g+')" style="margin-top:6px">📅 라운드 추가</button>';

  return html;

  award:  ['🥇 우승|우승 트로피 + 상장 + 상품|각 학년별 1팀','🥈 준우승|준우승 트로피 + 상장 + 상품|각 학년별 1팀','🥉 3위|3위 상장 + 상품|각 학년별 1팀','🤝 페어플레이상|페어플레이 상장|각 학년별 1팀'],
  emergency: ['골절·염좌|즉시 경기 중단 → 교사 호출 → 냉찜질 → 양호실 이송','머리 부상|즉시 안정 → 의식 확인 → 119 신고','열사병·탈수|서늘한 곳 이동 → 옷 느슨하게 → 물 소량 제공 → 교사 호출']
};
function renderInfoCard(type) {
  var el = document.getElementById('body-'+type);
  if (!el) return;
  if (type==='safety') {
    el.innerHTML = infoData.safety.map(function(item,i){
      return '<div class="info-item"><div class="info-bullet safety">'+(i+1)+'</div><div>'+item+'</div></div>';
    }).join('');
  } else if (type==='award') {
    var rows = infoData.award.map(function(r){
      var p=r.split('|');
      return '<tr><td>'+p[0]+'</td><td>'+p[1]+'</td><td>'+p[2]+'</td></tr>';
    }).join('');
    el.innerHTML = '<table class="award-table"><thead><tr><th>순위</th><th>시상 내용</th><th>대상</th></tr></thead><tbody>'+rows+'</tbody></table>';
  } else if (type==='emergency') {
    el.innerHTML = infoData.emergency.map(function(row,i){
      var idx2=row.indexOf('|');
      return '<div class="info-item"><div class="info-bullet emergency">'+['①','②','③'][i]+'</div><div><b>'+row.substring(0,idx2)+'</b>: '+row.substring(idx2+1)+'</div></div>';
    }).join('')+'<div style="margin-top:9px;background:#fef2f2;border-radius:5px;padding:7px 9px;font-size:11px;color:#991b1b;font-weight:700">🆘 비상연락: 담당 교사 → 보건 교사 → 119</div>';
  }
  var eb = document.getElementById('editBtn-'+type);
  if (eb) eb.style.display = isAdmin ? 'block' : 'none';
}
function toggleInfoEdit(type) {
  var a = document.getElementById('editArea-'+type);
  if (a.classList.contains('open')) { a.classList.remove('open'); return; }
  document.getElementById('editText-'+type).value = infoData[type].join('\n');
  a.classList.add('open');
}
function cancelInfoEdit(type) { document.getElementById('editArea-'+type).classList.remove('open'); }
function saveInfoEdit(type) {
  infoData[type] = document.getElementById('editText-'+type).value.trim().split('\n').map(function(s){return s.trim();}).filter(function(s){return s;});
  renderInfoCard(type);
  document.getElementById('editArea-'+type).classList.remove('open');
  save('info');
  showToast('저장됨!');
}

/* ── 토너먼트 ── */
function makeTeams(g) {
  return Array.from({length:10}, function(_,i){return {id:i+1, name:(i+1)+'반'};});
}
function initTournament(g) {
  var t = makeTeams(g);
  return {teams:t, rounds:{
    r1:[
      {id:g+'_r1_0',round:'1라운드',home:t[6],away:t[9],homeScore:null,awayScore:null,status:'scheduled',winner:null,date:'',teacher:'',referee:''},
      {id:g+'_r1_1',round:'1라운드',home:t[7],away:t[8],homeScore:null,awayScore:null,status:'scheduled',winner:null,date:'',teacher:'',referee:''}
    ],
    qf:[
      {id:g+'_qf_0',round:'8강',home:t[0],away:null,homeScore:null,awayScore:null,status:'scheduled',winner:null,date:'',teacher:'',referee:''},
      {id:g+'_qf_1',round:'8강',home:t[1],away:null,homeScore:null,awayScore:null,status:'scheduled',winner:null,date:'',teacher:'',referee:''},
      {id:g+'_qf_2',round:'8강',home:t[2],away:t[5],homeScore:null,awayScore:null,status:'scheduled',winner:null,date:'',teacher:'',referee:''},
      {id:g+'_qf_3',round:'8강',home:t[3],away:t[4],homeScore:null,awayScore:null,status:'scheduled',winner:null,date:'',teacher:'',referee:''}
    ],
    sf:[
      {id:g+'_sf_0',round:'4강',home:null,away:null,homeScore:null,awayScore:null,status:'scheduled',winner:null,date:'',teacher:'',referee:''},
      {id:g+'_sf_1',round:'4강',home:null,away:null,homeScore:null,awayScore:null,status:'scheduled',winner:null,date:'',teacher:'',referee:''}
    ],
    third:[{id:g+'_third_0',round:'3·4위전',home:null,away:null,homeScore:null,awayScore:null,status:'scheduled',winner:null,date:'',teacher:'',referee:''}],
    final:[{id:g+'_final_0',round:'결승전',home:null,away:null,homeScore:null,awayScore:null,status:'scheduled',winner:null,date:'',teacher:'',referee:''}]
  }};
}
var tournaments = {1:initTournament(1), 2:initTournament(2), 3:initTournament(3)};

function propagate(g) {
  var R = tournaments[g].rounds;
  R.qf[0].away = R.r1[1].winner || null;
  R.qf[1].away = R.r1[0].winner || null;
  R.sf[0].home = R.qf[0].winner || null;
  R.sf[0].away = R.qf[3].winner || null;
  R.sf[1].home = R.qf[1].winner || null;
  R.sf[1].away = R.qf[2].winner || null;
  R.final[0].home = R.sf[0].winner || null;
  R.final[0].away = R.sf[1].winner || null;
  var l0 = R.sf[0].status==='done' ? (R.sf[0].winner===R.sf[0].home?R.sf[0].away:R.sf[0].home) : null;
  var l1 = R.sf[1].status==='done' ? (R.sf[1].winner===R.sf[1].home?R.sf[1].away:R.sf[1].home) : null;
  R.third[0].home = l0;
  R.third[0].away = l1;
}

function teamLabel(t) { return t ? t.name : 'TBD'; }

function countStats() {
  var done=0, sched=0;
  [1,2,3].forEach(function(g){
    var R=tournaments[g].rounds;
    [].concat(R.r1,R.qf,R.sf,R.third,R.final).forEach(function(m){
      if(m.status==='done') done++; else sched++;
    });
  });
  return {total:done+sched, done:done, sched:sched};
}

function matchNodeHTML(m, g) {
  var cls      = gradeInfo[g].cls;
  var hWin     = m.status==='done' && m.winner===m.home;
  var aWin     = m.status==='done' && m.winner===m.away;
  var statusTxt= m.status==='done' ? '완료' : '예정';
  var pillCls  = m.status==='done' ? 'pill-done' : 'pill-scheduled';
  var hNm      = teamLabel(m.home);
  var aNm      = teamLabel(m.away);
  var hScore   = (m.homeScore!==null&&m.homeScore!==undefined) ? m.homeScore : '-';
  var aScore   = (m.awayScore!==null&&m.awayScore!==undefined) ? m.awayScore : '-';
  var dateDisp = m.date ? '📅 '+fmtDate(m.date) : '날짜 미정';
  var dateCol  = m.date ? '' : 'color:#c8c8d4;';
  var teacher  = m.teacher||'';
  var referee  = m.referee||'';
  var staffRow = '';
  if (teacher||referee) {
    staffRow = '<div class="staff-row">'
      +(teacher?'👨‍🏫 '+teacher:'')
      +(teacher&&referee?' · ':'')
      +(referee?'🏁 '+referee:'')
      +'</div>';
  }
  var adminBtn = '';
  if (isAdmin) {
    adminBtn = '<button class="edit-btn-small" onclick="toggleEditPanel(\''+m.id+'\')">✏️</button>';
  }
  var ep = '';
  if (isAdmin) {
    ep = '<div class="edit-panel" id="ep_'+m.id+'">'
      +'<div class="edit-row"><span style="font-size:11px;font-weight:700;color:var(--navy)">팀 수정</span></div>'
      +'<div class="edit-row"><span class="edit-lbl">홈</span><input class="inp-team" type="text" id="hn_'+m.id+'" value="'+(hNm==='TBD'?'':hNm)+'" placeholder="예) 3반"></div>'
      +'<div class="edit-row"><span class="edit-lbl">원정</span><input class="inp-team" type="text" id="an_'+m.id+'" value="'+(aNm==='TBD'?'':aNm)+'" placeholder="예) 7반"></div>'
      +'<div class="edit-row"><span class="edit-lbl">교사</span><input class="inp-team" type="text" id="tc_'+m.id+'" value="'+teacher+'" placeholder="담당 교사"></div>'
      +'<div class="edit-row"><span class="edit-lbl">심판</span><input class="inp-team" type="text" id="rf_'+m.id+'" value="'+referee+'" placeholder="심판 이름"></div>'
      +'<div class="edit-divider">날짜 / 점수 / 상태</div>'
      +'<div class="edit-row"><span class="edit-lbl">날짜</span><input class="inp-date" type="date" id="dt_'+m.id+'" value="'+(m.date||'')+'"></div>'
      +'<div class="edit-row">'
      +'<span class="edit-lbl">'+hNm+'</span>'
      +'<input class="inp-sc" type="number" min="0" max="99" id="hs_'+m.id+'" value="'+(m.homeScore!==null&&m.homeScore!==undefined?m.homeScore:'')+'">'
      +'<span style="font-weight:700;color:var(--text2)">:</span>'
      +'<input class="inp-sc" type="number" min="0" max="99" id="as_'+m.id+'" value="'+(m.awayScore!==null&&m.awayScore!==undefined?m.awayScore:'')+'">'
      +'<span class="edit-lbl">'+aNm+'</span>'
      +'<select class="sel-st" id="st_'+m.id+'">'
      +'<option value="scheduled"'+(m.status==='scheduled'?' selected':'')+'>예정</option>'
      +'<option value="done"'+(m.status==='done'?' selected':'')+'>완료</option>'
      +'</select></div>'
      +'<div class="edit-row" style="justify-content:flex-end">'
      +'<button class="save-btn" onclick="saveMatch(\''+m.id+'\','+g+')">💾 저장</button>'
      +'</div></div>';
  }
  var hRowCls = hWin?'winner':(m.status==='done'?'loser':'');
  var aRowCls = aWin?'winner':(m.status==='done'?'loser':'');
  return '<div class="match-node '+cls+'-node" id="node_'+m.id+'">'
    +'<div class="match-top '+cls+'">'
    +'<div class="match-round-row">'
    +'<span class="match-round-label '+cls+'">'+m.round+'</span>'
    +'<span style="display:flex;align-items:center;gap:3px">'
    +'<span class="match-status-pill '+pillCls+'">'+statusTxt+'</span>'
    +adminBtn+'</span></div>'
    +'<div class="match-date-row" style="'+dateCol+'">'+dateDisp+'</div>'
    +'</div>'+staffRow
    +'<div class="team-row '+hRowCls+'">'
    +'<div class="team-nm">'+hNm+'</div>'
    +'<div class="team-sc '+(hWin?'win-sc':'')+'">'+hScore+'</div>'
    +'</div>'
    +'<div class="team-row '+aRowCls+'">'
    +'<div class="team-nm">'+aNm+'</div>'
    +'<div class="team-sc '+(aWin?'win-sc':'')+'">'+aScore+'</div>'
    +'</div>'+ep+'</div>';
}

function toggleEditPanel(id) {
  var el = document.getElementById('ep_'+id);
  if (el) el.classList.toggle('open');
}

function saveMatch(id, g) {
  var R=tournaments[g].rounds;
  var allM=[].concat(R.r1,R.qf,R.sf,R.third,R.final);
  var m=allM.find(function(x){return x.id===id;});
  if (!m) return;
  var hnEl=document.getElementById('hn_'+id);
  var anEl=document.getElementById('an_'+id);
  var tcEl=document.getElementById('tc_'+id);
  var rfEl=document.getElementById('rf_'+id);
  if (hnEl&&hnEl.value.trim()&&m.home) m.home.name=hnEl.value.trim();
  if (anEl&&anEl.value.trim()&&m.away) m.away.name=anEl.value.trim();
  m.date    = document.getElementById('dt_'+id).value;
  m.teacher = tcEl ? tcEl.value.trim() : '';
  m.referee = rfEl ? rfEl.value.trim() : '';
  var hsV=document.getElementById('hs_'+id).value;
  var asV=document.getElementById('as_'+id).value;
  var st=document.getElementById('st_'+id).value;
  m.homeScore = hsV===''?null:+hsV;
  m.awayScore = asV===''?null:+asV;
  m.status    = st;
  if (st==='done'&&m.homeScore!==null&&m.awayScore!==null) {
    m.winner = m.homeScore>m.awayScore ? m.home : (m.awayScore>m.homeScore?m.away:null);
  } else {
    m.winner = null;
  }
  syncBracketToSched(g, m, id);
  propagate(g);
  renderBracket(g);
  renderHome();
  save('match');
  showToast('저장됨!');
}

function renderBracket(g) {
  propagate(g);
  var T=tournaments[g], R=T.rounds, info=gradeInfo[g], cls=info.cls;
  var allM=[].concat(R.r1,R.qf,R.sf,R.third,R.final);
  var done=allM.filter(function(m){return m.status==='done';}).length;
  var f=R.final[0];
  var champ='', second='', third_='';
  if (f.status==='done'&&f.winner) {
    champ=f.winner.name;
    second=(f.winner===f.home?f.away:f.home)?((f.winner===f.home?f.away:f.home).name||''):'';
  }
  if (R.third[0].status==='done'&&R.third[0].winner) third_=R.third[0].winner.name;
  var podium='';
  if (champ||second||third_) {
    podium='<div class="podium-grid">'
      +(champ?'<div class="podium-card gold-b"><div style="font-size:18px">🥇</div><div class="podium-name">'+champ+'</div><div class="podium-lbl">우승</div></div>':'')
      +(second?'<div class="podium-card"><div style="font-size:18px">🥈</div><div class="podium-name">'+second+'</div><div class="podium-lbl">준우승</div></div>':'')
      +(third_?'<div class="podium-card"><div style="font-size:18px">🥉</div><div class="podium-name">'+third_+'</div><div class="podium-lbl">3위</div></div>':'')
      +'</div>';
  }
  function rl(s) {
    return '<div class="round-col-label '+cls+'">'+(s==='결승전'?'🏆 결승전':s)+'</div>';
  }
  function mapRound(arr) {
    return arr.map(function(m){return matchNodeHTML(m,g);}).join('');
  }
  var bracketHTML = '<div class="bracket-header">'
    +'<div class="grade-badge '+cls+'">'+info.icon+' '+info.name+'</div>'
    +'<div class="sport-badge '+cls+'">'+info.sport+'</div>'
    +'<div style="font-size:12px;color:var(--text2);margin-left:auto">'+done+'/9 완료</div>'
    +'</div>'
    +podium
    +'<div class="section-title" style="margin-top:0">토너먼트 대진표</div>'
    +'<div class="bracket-wrap"><div class="round-col-grid">'
    +'<div>'+rl('1라운드')+'<div style="padding:3px">'+mapRound(R.r1)+'</div></div>'
    +'<div>'+rl('8강')+'<div style="padding:3px">'+mapRound(R.qf)+'</div></div>'
    +'<div>'+rl('4강')+'<div style="padding:3px">'+mapRound(R.sf)+'</div></div>'
    +'<div>'+rl('3·4위전')+'<div style="padding:3px">'+mapRound(R.third)+'</div></div>'
    +'<div>'+rl('결승전')+'<div style="padding:3px">'+mapRound(R.final)+'</div></div>'
    +'</div></div>'
    +'<div class="section-title">'+info.schedLabel+'</div>';
  var schedHTML = '';
  try { schedHTML = renderSchedule(g); }
  catch(e) { schedHTML='<p style="color:red">경기일정 오류: '+e.message+'</p>'; }
  document.getElementById('page-bracket'+g).innerHTML = bracketHTML + schedHTML;
}

/* ── 게시판 ── */
var noticePosts  = [];
var studentPosts = [];
var nextNoticeId=10, nextStudentId=200, _writeTarget='student';
var noticePage=1, studentPage=1;
var PAGE_SIZE=5;

function renderNoticeListEl(containerId, pagingId, page, showAdmin) {
  var n=noticePosts.length, pages=Math.max(1,Math.ceil(n/PAGE_SIZE));
  if(page>pages) page=1;
  var slice=noticePosts.slice().reverse().slice((page-1)*PAGE_SIZE, page*PAGE_SIZE);
  document.getElementById(containerId).innerHTML = slice.length
    ? slice.map(function(p){
        return '<div class="post-item">'
          +'<div style="display:flex;align-items:center;gap:5px;margin-bottom:2px">'
          +'<span class="post-badge">📢 '+p.cat+'</span>'
          +'<div class="post-title-sm" onclick="viewPost('+p.id+',\'notice\')">'+p.f1+'</div>'
          +'</div>'
          +'<div class="post-meta-sm"><span>'+p.f2+'</span><span>'+p.date+'</span>'
          +(showAdmin?'<div class="post-actions show"><button class="act-btn act-edit" onclick="openEditPost('+p.id+',\'notice\')">수정</button><button class="act-btn act-del" onclick="confirmDelPost('+p.id+',\'notice\')">삭제</button></div>':'')
          +'</div></div>';
      }).join('')
    : '<div class="empty-msg">공지사항이 없습니다.</div>';
  if (pagingId) document.getElementById(pagingId).innerHTML = buildPaging(page, pages, containerId==='noticeListHome'?'noticePage':'noticePage');
}

function renderBoard() {
  var nb=document.getElementById('noticeWriteBtn');
  if(nb) nb.style.display=isAdmin?'inline-block':'none';
  renderNoticeListEl('noticeList','noticePaging',noticePage,isAdmin);
  var sPages=Math.max(1,Math.ceil(studentPosts.length/PAGE_SIZE));
  if(studentPage>sPages) studentPage=1;
  var sSlice=studentPosts.slice().reverse().slice((studentPage-1)*PAGE_SIZE,studentPage*PAGE_SIZE);
  document.getElementById('studentList').innerHTML = sSlice.length
    ? sSlice.map(function(p){
        return '<div class="post-item">'
          +'<div style="display:flex;align-items:center;gap:5px;margin-bottom:2px">'
          +'<span class="post-badge">'+(p.cat==='응원'?'🎉':p.cat==='문의'?'❓':'💬')+' '+p.cat+'</span>'
          +'<div class="post-title-sm" onclick="viewPost('+p.id+',\'student\')">'+(p.f3.length>20?p.f3.substring(0,20)+'…':p.f3)+'</div>'
          +'</div>'
          +'<div class="post-meta-sm"><span style="font-weight:700">'+p.f1+'</span><span>'+p.f2+'</span><span>'+p.date+'</span>'
          +(isAdmin?'<div class="post-actions show"><button class="act-btn act-edit" onclick="openEditPost('+p.id+',\'student\')">수정</button><button class="act-btn act-del" onclick="confirmDelPost('+p.id+',\'student\')">삭제</button></div>':'')
          +'</div></div>';
      }).join('')
    : '<div class="empty-msg">게시글이 없습니다.</div>';
  document.getElementById('studentPaging').innerHTML = buildPaging(studentPage, sPages, 'studentPage');
  ['safety','award','emergency'].forEach(function(t){renderInfoCard(t);});
}

function buildPaging(cur, total, varName) {
  if(total<=1) return '';
  var h='<button class="pg-btn" onclick="'+varName+'=Math.max(1,'+varName+'-1);renderBoard()" '+(cur===1?'disabled':'')+'>‹</button>';
  for(var i=1;i<=total;i++) h+='<button class="pg-btn '+(i===cur?'active':'')+'" onclick="'+varName+'='+i+';renderBoard()">'+i+'</button>';
  h+='<button class="pg-btn" onclick="'+varName+'=Math.min('+total+','+varName+'+1);renderBoard()" '+(cur===total?'disabled':'')+'>›</button>';
  return h;
}

function openWriteModal(target) {
  _writeTarget=target;
  var isN=target==='notice';
  document.getElementById('writeModalTitle').textContent=isN?'📢 공지사항 작성':'💬 학생 게시판 글쓰기';
  document.getElementById('noticeCatRow').style.display=isN?'block':'none';
  document.getElementById('studentCatRow').style.display=isN?'none':'block';
  document.getElementById('wLbl1').textContent=isN?'제목':'학번';
  document.getElementById('wLbl2').textContent=isN?'작성자':'이름';
  ['wF1','wF2','wF3'].forEach(function(id){document.getElementById(id).value='';});
  openModal('writeModal');
}
function submitPost() {
  var f1=document.getElementById('wF1').value.trim();
  var f2=document.getElementById('wF2').value.trim();
  var f3=document.getElementById('wF3').value.trim();
  if(!f1||!f3){showToast('필수 항목을 입력해 주세요.');return;}
  var isN=_writeTarget==='notice';
  var cat=isN?document.getElementById('noticeCat').value:document.getElementById('studentCat').value;
  var d=new Date();
  var ds=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  var post={type:_writeTarget,cat:cat,f1:f1,f2:f2||(isN?'작성자':'익명'),f3:f3,date:ds};
  if(isN){post.id=nextNoticeId++;noticePosts.push(post);}
  else{post.id=nextStudentId++;studentPosts.push(post);}
  closeModal('writeModal');
  renderBoard();
  if(document.getElementById('page-home').classList.contains('active')) renderHome();
  save('posts');
  showToast('등록됨!');
}
function openEditPost(id,type) {
  var list=type==='notice'?noticePosts:studentPosts;
  var p=list.find(function(x){return x.id===id;});

  document.getElementById('epLbl1').textContent=isN?'제목':'학번';
  document.getElementById('epLbl2').textContent=isN?'작성자':'이름';
  document.getElementById('epF1').value=p.f1;

function saveEditPost() {
  var id=+document.getElementById('epId').value;
  var type=document.getElementById('epType').value;
  var list=type==='notice'?noticePosts:studentPosts;
  var p=list.find(function(x){return x.id===id;});

  p.f1=document.getElementById('epF1').value.trim()||p.f1;
  p.f2=document.getElementById('epF2').value.trim()||p.f2;
  p.f3=document.getElementById('epF3').value.trim()||p.f3;

  renderBoard();
  if(document.getElementById('page-home').classList.contains('active')) renderHome();
  save('posts');
  showToast('수정됨!');
}
function viewPost(id,type) {
  var list=type==='notice'?noticePosts:studentPosts;
  var p=list.find(function(x){return x.id===id;});
  if(!p)return;
  var isN=type==='notice';
  document.getElementById('pvTitle').textContent=isN?p.f1:p.f2;
  document.getElementById('pvMeta').textContent=isN?p.cat+' · '+p.f2+' · '+p.date:p.cat+' · 학번:'+p.f1+' · '+p.f2+' · '+p.date;
  document.getElementById('pvBody').textContent=p.f3;
  openModal('postViewModal');
}
function confirmDelPost(id,type) {
  document.getElementById('confirmMsg').textContent='이 게시글을 삭제하시겠습니까?';
  document.getElementById('confirmOkBtn').onclick=function(){
    if(type==='notice') noticePosts=noticePosts.filter(function(x){return x.id!==id;});
    else studentPosts=studentPosts.filter(function(x){return x.id!==id;});
    closeModal('confirmModal');
    renderBoard();
    if(document.getElementById('page-home').classList.contains('active')) renderHome();
    save('posts');
    showToast('삭제됨.');
  };
  openModal('confirmModal');
}

/* ── 관리자 ── */
function openAdminModal() {
  if (isAdmin) {
    if (typeof fbLogout==='function') fbLogout();
    return;
  }
  if (!TEACHER_MODE) { showToast('교사용 링크로 접속해 주세요.'); return; }
  document.getElementById('adminPin').value='';
  document.getElementById('adminError').textContent='';
  openModal('adminModal');
  setTimeout(function(){document.getElementById('adminPin').focus();},100);
}
function checkAdmin() {
  var pin=document.getElementById('adminPin').value;
  if(!pin){document.getElementById('adminError').textContent='비밀번호를 입력해 주세요.';return;}
  if(typeof fbCheckAdmin==='function') fbCheckAdmin(pin);
  else document.getElementById('adminError').textContent='Firebase 초기화 중입니다. 잠시 후 다시 시도해 주세요.';
}
function activateAdmin() {
  isAdmin=true;
  closeModal('adminModal');
  var btn=document.getElementById('adminBtn');
  if(btn){btn.classList.add('active-admin');btn.textContent='🔓 로그아웃';btn.style.display='block';}
  document.getElementById('teacherBadge').style.display='inline';
  updateAdminUI();
  [1,2,3].forEach(function(g){
    var c=document.getElementById('page-bracket'+g);
    if(c&&c.innerHTML.trim()) renderBracket(g);
  });
  renderBoard(); renderHome();
  if(document.getElementById('page-rules').classList.contains('active')) renderRulesCard();
  showToast('✅ 교사 모드 활성화');
}
function deactivateAdmin() {
  isAdmin=false;
  var btn=document.getElementById('adminBtn');
  if(btn){btn.classList.remove('active-admin');btn.textContent='🔒 관리자';if(TEACHER_MODE)btn.style.display='block';}
  document.getElementById('teacherBadge').style.display='none';
  updateAdminUI();
  [1,2,3].forEach(function(g){
    var c=document.getElementById('page-bracket'+g);
    if(c&&c.innerHTML.trim()) renderBracket(g);
  });
  renderBoard(); renderHome();
}
function updateAdminUI() {
  ['safety','award','emergency'].forEach(function(t){
    var el=document.getElementById('editBtn-'+t);
    if(el) el.style.display=isAdmin?'block':'none';
  });
}

/* ── 페이지 이동 ── */
function openModal(id) { document.getElementById(id).classList.add('show'); }
function closeModal(id) { document.getElementById(id).classList.remove('show'); }
function showPage(name, btn) {
  document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active');});
  document.querySelectorAll('.nav-tab').forEach(function(t){t.classList.remove('active');});
  document.getElementById('page-'+name).classList.add('active');
  btn.classList.add('active');
  if(['bracket1','bracket2','bracket3'].indexOf(name)>-1) renderBracket(+name.slice(-1));
  if(name==='home') renderHome();
  if(name==='board') renderBoard();
  if(name==='rules') renderRulesCard();
}
function goGrade(g) {
  document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active');});
  document.querySelectorAll('.nav-tab').forEach(function(t,i){t.classList.remove('active');if(i===g)t.classList.add('active');});
  document.getElementById('page-bracket'+g).classList.add('active');
  renderBracket(g);
}
function showToast(msg) {
  var t=document.getElementById('toast');
  t.textContent=msg; t.style.display='block';
  clearTimeout(t._t);
  t._t=setTimeout(function(){t.style.display='none';},2500);
}

/* ── localStorage 캐시 (즉시 로드) ── */
function loadCache() {
  try {
    var cached=localStorage.getItem('hansucup_v2');
    if(!cached) return;
    var d=JSON.parse(cached);
    if(d.tournaments) {
      var T=JSON.parse(d.tournaments);
      [1,2,3].forEach(function(g){
        if(!T[g]) return;
        var R=T[g].rounds;
        [].concat(R.r1,R.qf,R.sf,R.third,R.final).forEach(function(m){
          if(!m||!m.winner) return;
          if(m.home&&m.winner.id===m.home.id) m.winner=m.home;
          else if(m.away&&m.winner.id===m.away.id) m.winner=m.away;
          else m.winner=null;
        });
        tournaments[g]=T[g]; propagate(g);
      });
    }
    if(d.schedules)       Object.assign(schedules,      JSON.parse(d.schedules));
    if(d.noticePosts)     noticePosts     = JSON.parse(d.noticePosts);
    if(d.studentPosts)    studentPosts    = JSON.parse(d.studentPosts);
    if(d.overviewData)    overviewData    = JSON.parse(d.overviewData);
    if(d.rulesData)       rulesData       = JSON.parse(d.rulesData);
    if(d.infoData)        Object.assign(infoData, JSON.parse(d.infoData));
    if(d.calManualEvents) calManualEvents = JSON.parse(d.calManualEvents);
  } catch(e) { localStorage.removeItem('hansucup_v2'); }
}

/* ── Firebase에 저장 ── */
function save(label) {
  if(typeof _fbSave==='function') _fbSave(label);
}

/* ── 초기화 ── */

  document.getElementById('adminBtn').style.display='block';
  document.querySelector('.nav-inner').style.background='#1a4a2a';
}
renderHome();
renderRulesCard();
['safety','award','emergency'].forEach(function(t){renderInfoCard(t);});
</script>

function _fbSave(label) {

    schedules:       JSON.stringify(schedules),
    noticePosts:     JSON.stringify(noticePosts),

    infoData:        JSON.stringify(infoData),
