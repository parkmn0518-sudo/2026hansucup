
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Bebas+Neue&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1a2a5e;--navy-dark:#0f1a3d;--navy-light:#2a3f8f;
  --gold:#c9952a;--gold-light:#f0c050;
  --white:#fff;--bg:#f4f5f8;--card:#fff;
  --text:#1a1a2e;--text2:#4a5580;--border:#d8dce8;
  --win:#16a34a;--loss:#dc2626;--radius:10px;
}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
.top-nav{background:var(--navy);padding:0 14px;display:flex;align-items:center;gap:10px;height:54px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.3);}
.logo-area{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.logo-badge{width:34px;height:34px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:17px;color:var(--navy-dark);}
.logo-text{color:var(--white);font-size:12px;font-weight:700;line-height:1.2;}
.logo-text span{display:block;font-size:10px;font-weight:400;color:rgba(255,255,255,.6);}
.nav-tabs{display:flex;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none;}
.nav-tabs::-webkit-scrollbar{display:none;}
.nav-tab{padding:7px 11px;border-radius:6px;color:rgba(255,255,255,.7);font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;border:none;background:none;transition:all .15s;}
.nav-tab:hover{color:var(--white);background:rgba(255,255,255,.1);}
.nav-tab.active{color:var(--gold-light);background:rgba(201,149,42,.2);font-weight:700;}
.admin-btn{padding:6px 10px;border-radius:6px;border:1px solid var(--gold);color:var(--gold-light);font-size:11px;font-weight:700;background:none;cursor:pointer;white-space:nowrap;transition:all .15s;}
.admin-btn:hover,.admin-btn.active-admin{background:var(--gold);color:var(--navy-dark);}
.page{display:none;padding:14px;max-width:980px;margin:0 auto;}
.page.active{display:block;}

/* HOME HERO */
.hero{background:var(--navy);border-radius:var(--radius);padding:20px 22px;margin-bottom:14px;position:relative;overflow:hidden;}
.hero::before{content:'';position:absolute;right:-20px;top:-20px;width:160px;height:160px;border-radius:50%;background:rgba(201,149,42,.1);pointer-events:none;}
.hero-title{font-family:'Bebas Neue',sans-serif;font-size:30px;color:var(--gold-light);letter-spacing:2px;}
.hero-sub{color:rgba(255,255,255,.8);font-size:13px;margin-top:3px;}
.hero-meta{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
.hero-badge{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:6px;padding:4px 10px;color:rgba(255,255,255,.9);font-size:11px;}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:14px;}
.summary-card{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);padding:12px;text-align:center;}
.summary-card .num{font-size:26px;font-weight:700;color:var(--navy);font-family:'Bebas Neue',sans-serif;}
.summary-card .lbl{font-size:11px;color:var(--text2);margin-top:1px;}
.section-title{font-size:13px;font-weight:700;color:var(--navy);margin:16px 0 8px;padding-left:9px;border-left:3px solid var(--gold);}

/* ── CALENDAR ── */
.cal-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:14px;}
.cal-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--navy);}
.cal-nav-btn{background:none;border:1px solid rgba(255,255,255,.3);color:var(--white);border-radius:5px;width:28px;height:28px;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.cal-nav-btn:hover{background:rgba(255,255,255,.15);}
.cal-month-title{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--gold-light);letter-spacing:1px;}
.cal-add-btn{padding:4px 10px;background:var(--gold);color:var(--navy-dark);border:none;border-radius:5px;font-size:11px;font-weight:700;cursor:pointer;display:none;}
.cal-add-btn.show{display:block;}
.cal-grid-header{display:grid;grid-template-columns:repeat(7,1fr);background:#f0f2f8;}
.cal-day-name{text-align:center;padding:6px 0;font-size:11px;font-weight:700;color:var(--text2);}
.cal-day-name:first-child{color:#e53e3e;}
.cal-day-name:last-child{color:#3182ce;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--border);}
.cal-cell{min-height:64px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:4px;position:relative;vertical-align:top;}
.cal-cell:nth-child(7n){border-right:none;}
.cal-cell.empty{background:#f9fafb;}
.cal-cell.today{background:#fffbf0;}
.cal-cell.today .cal-date{background:var(--navy);color:var(--white);border-radius:50%;}
.cal-date{width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--text);margin-bottom:2px;}
.cal-cell.sunday .cal-date{color:#e53e3e;}
.cal-cell.saturday .cal-date{color:#3182ce;}
.cal-event{font-size:10px;line-height:1.3;padding:1px 4px;border-radius:3px;margin-bottom:2px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
.ev-futsal{background:#dbeafe;color:#1e40af;}
.ev-tchouk{background:#dcfce7;color:#14532d;}
.ev-volleyball{background:#fef3c7;color:#92400e;}
.ev-special{background:#f3e8ff;color:#6b21a8;}
.ev-general{background:#e0e4f0;color:var(--navy);}
.cal-more{font-size:9px;color:var(--text2);padding-left:4px;}
/* event delete btn */
.ev-del{display:none;background:#fee2e2;color:#991b1b;border:none;border-radius:2px;font-size:9px;font-weight:700;cursor:pointer;padding:0 3px;margin-left:2px;vertical-align:middle;}
.admin-mode .ev-del{display:inline;}

/* calendar legend */
.cal-legend{display:flex;gap:10px;flex-wrap:wrap;padding:8px 14px;border-top:1px solid var(--border);background:#f9fafb;}
.leg-item{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--text2);}
.leg-dot{width:10px;height:10px;border-radius:2px;}

/* BRACKET */
.bracket-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.grade-badge{padding:6px 16px;border-radius:20px;background:var(--navy);color:var(--white);font-size:13px;font-weight:700;}
.sport-badge{padding:6px 14px;border-radius:20px;background:var(--gold);color:var(--navy-dark);font-size:13px;font-weight:700;}
.bracket-wrap{overflow-x:auto;padding-bottom:8px;}
.match-node{background:var(--card);border:1.5px solid var(--border);border-radius:8px;margin:5px;overflow:hidden;min-width:155px;}
.match-node.current-game{border-color:var(--gold);box-shadow:0 0 0 2px rgba(201,149,42,.2);}
.match-top{background:#f0f2f8;border-bottom:1px solid var(--border);padding:4px 8px;}
.match-round-row{display:flex;align-items:center;justify-content:space-between;gap:4px;}
.match-round-label{font-size:10px;font-weight:700;color:var(--navy);}
.match-status-pill{font-size:9px;font-weight:700;padding:1px 6px;border-radius:8px;}
.pill-scheduled{background:#e0e4f0;color:var(--navy);}
.pill-playing{background:#fef3c7;color:#92400e;animation:blink 1s infinite;}
.pill-done{background:#dcfce7;color:#14532d;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
.match-date-row{font-size:9px;color:var(--text2);margin-top:2px;}
.team-row{display:flex;align-items:center;padding:8px 10px;border-bottom:1px solid var(--border);}
.team-row:last-of-type{border-bottom:none;}
.team-row.winner{background:#f0fdf4;}
.team-row.loser{opacity:.55;}
.team-nm{font-size:13px;font-weight:700;color:var(--text);flex:1;}
.team-sc{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--navy);min-width:22px;text-align:right;line-height:1;}
.team-sc.win-sc{color:var(--win);}
.edit-panel{background:#f8f9fc;border-top:1px solid var(--border);padding:10px 12px;display:none;flex-direction:column;gap:7px;}
.edit-panel.show{display:flex;}
.edit-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.edit-label{font-size:11px;color:var(--text2);min-width:28px;}
.team-inp{flex:1;min-width:80px;padding:5px 8px;border:1.5px solid var(--navy);border-radius:5px;font-size:12px;font-family:'Noto Sans KR',sans-serif;}
.date-inp{flex:1;min-width:110px;padding:5px 8px;border:1.5px solid var(--navy);border-radius:5px;font-size:11px;font-family:'Noto Sans KR',sans-serif;}
.sc-inp{width:50px;padding:5px 6px;border:1.5px solid var(--navy);border-radius:5px;font-size:14px;font-weight:700;text-align:center;}
.st-sel{padding:5px 7px;border:1.5px solid var(--navy);border-radius:5px;font-size:11px;font-family:'Noto Sans KR',sans-serif;}
.save-btn{padding:5px 14px;background:var(--navy);color:var(--white);border:none;border-radius:5px;font-size:11px;font-weight:700;cursor:pointer;}
.edit-btn-small{padding:3px 8px;background:none;border:1px solid var(--navy);border-radius:4px;font-size:10px;color:var(--navy);cursor:pointer;}
.edit-divider{font-size:10px;color:var(--text2);font-weight:700;border-top:1px solid var(--border);padding-top:6px;margin-top:2px;}

/* SCHEDULE */
.sched-wrap{margin-top:4px;}
.round-block{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;}
.round-block-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;cursor:pointer;user-select:none;}
.round-block-header:hover{background:#f8f9fc;}
.round-block-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--navy);}
.round-status-badge{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:700;}
.rsb-done{background:var(--win);color:#fff;}.rsb-ongoing{background:var(--gold);color:var(--navy-dark);}.rsb-scheduled{background:#e0e4f0;color:var(--navy);}
.round-toggle{font-size:12px;color:var(--text2);transition:transform .2s;}
.round-toggle.open{transform:rotate(180deg);}
.round-body{display:none;padding:10px 14px;}
.round-body.open{display:block;}
.sched-table{width:100%;border-collapse:collapse;font-size:12px;}
.sched-table th{background:var(--navy);color:var(--white);padding:7px 10px;text-align:center;font-weight:700;font-size:11px;}
.sched-table td{padding:7px 10px;text-align:center;border-bottom:1px solid var(--border);vertical-align:middle;}
.sched-table tr:last-child td{border-bottom:none;}
.sched-table tr:hover td{background:#f8f9fc;}
.vs-cell{font-weight:700;color:var(--text);}
.admin-game-bar{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;}
.add-game-btn{padding:5px 12px;background:var(--navy);color:var(--white);border:none;border-radius:5px;font-size:11px;font-weight:700;cursor:pointer;}
.del-round-btn{padding:5px 10px;background:#fee2e2;color:#991b1b;border:none;border-radius:5px;font-size:10px;font-weight:700;cursor:pointer;}
.add-round-btn{padding:7px 16px;background:var(--gold);color:var(--navy-dark);border:none;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;margin-top:6px;}
.del-game-btn{padding:2px 7px;background:#fee2e2;color:#991b1b;border:none;border-radius:4px;font-size:10px;font-weight:700;cursor:pointer;}
.edit-game-btn{padding:2px 7px;background:#e0e4f0;color:var(--navy);border:none;border-radius:4px;font-size:10px;font-weight:700;cursor:pointer;}

/* RULES — editable */
.rules-tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
.rules-tab{padding:7px 16px;border-radius:var(--radius);border:1.5px solid var(--navy);color:var(--navy);font-size:12px;font-weight:700;background:none;cursor:pointer;transition:all .15s;}
.rules-tab.active{background:var(--navy);color:var(--white);}
.rules-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;display:none;}
.rules-card.active{display:block;}
.rules-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.rules-card-title{font-size:15px;font-weight:700;color:var(--navy);}
.rules-edit-btn{padding:4px 12px;background:#e0e4f0;color:var(--navy);border:none;border-radius:5px;font-size:11px;font-weight:700;cursor:pointer;display:none;}
.rules-edit-btn.show{display:block;}
.rules-content{font-size:13px;line-height:1.9;white-space:pre-wrap;color:var(--text);}
.rules-edit-area{display:none;flex-direction:column;gap:8px;}
.rules-edit-area.show{display:flex;}
.rules-title-inp{width:100%;padding:7px 10px;border:1.5px solid var(--navy);border-radius:6px;font-size:14px;font-weight:700;font-family:'Noto Sans KR',sans-serif;}
.rules-body-ta{width:100%;padding:8px 10px;border:1.5px solid var(--navy);border-radius:6px;font-size:13px;font-family:'Noto Sans KR',sans-serif;resize:vertical;min-height:200px;line-height:1.9;}
.rules-edit-actions{display:flex;gap:6px;justify-content:flex-end;}
.rules-save-btn{padding:6px 14px;background:var(--navy);color:var(--white);border:none;border-radius:5px;font-size:11px;font-weight:700;cursor:pointer;}
.rules-cancel-btn{padding:6px 10px;background:var(--bg);color:var(--text2);border:none;border-radius:5px;font-size:11px;cursor:pointer;}

/* BOARD */
.board-page{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:640px){.board-page{grid-template-columns:1fr;}}
.board-col{display:flex;flex-direction:column;gap:10px;}
.board-section{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.board-section-header{background:var(--navy);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;}
.board-section-header.gold{background:var(--gold);}
.board-section-title{font-size:13px;font-weight:700;color:var(--white);}
.board-section-header.gold .board-section-title{color:var(--navy-dark);}
.write-btn-sm{padding:4px 10px;background:rgba(255,255,255,.2);color:var(--white);border:1px solid rgba(255,255,255,.4);border-radius:5px;font-size:11px;font-weight:700;cursor:pointer;}
.board-section-header.gold .write-btn-sm{background:rgba(26,42,94,.15);color:var(--navy-dark);border-color:rgba(26,42,94,.3);}
.post-list-inner{padding:8px;}
.post-item{padding:9px 10px;border-radius:7px;border:1px solid transparent;margin-bottom:4px;transition:all .15s;}
.post-item:hover{background:#f0f2f8;border-color:var(--border);}
.post-title-sm{font-size:12px;font-weight:700;color:var(--text);cursor:pointer;}
.post-meta-sm{font-size:10px;color:var(--text2);margin-top:2px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.post-badge{font-size:9px;padding:1px 6px;border-radius:8px;font-weight:700;background:#e0e4f0;color:var(--navy);}
.empty-msg{font-size:12px;color:var(--text2);padding:16px;text-align:center;}
.post-actions{display:none;gap:4px;margin-left:auto;}
.post-actions.show{display:flex;}
.act-btn{padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;cursor:pointer;border:none;}
.act-edit{background:#e0e4f0;color:var(--navy);}.act-del{background:#fee2e2;color:#991b1b;}
.info-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.info-card-header{padding:10px 14px;display:flex;align-items:center;gap:8px;justify-content:space-between;}
.info-card-header.safety{background:#fef3c7;}.info-card-header.award{background:#dcfce7;}.info-card-header.emergency{background:#fee2e2;}
.info-header-left{display:flex;align-items:center;gap:8px;}
.info-icon{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.info-icon.safety{background:#f59e0b;}.info-icon.award{background:#16a34a;}.info-icon.emergency{background:#dc2626;}
.info-card-title{font-size:13px;font-weight:700;}
.info-card-title.safety{color:#92400e;}.info-card-title.award{color:#14532d;}.info-card-title.emergency{color:#991b1b;}
.info-edit-btn{padding:3px 9px;border-radius:5px;font-size:10px;font-weight:700;cursor:pointer;border:none;display:none;}
.info-edit-btn.safety{background:#fde68a;color:#92400e;}.info-edit-btn.award{background:#bbf7d0;color:#14532d;}.info-edit-btn.emergency{background:#fecaca;color:#991b1b;}
.info-edit-btn.show{display:block;}
.info-body{padding:12px 14px;}
.info-item{display:flex;gap:8px;margin-bottom:7px;font-size:12px;line-height:1.7;}
.info-item:last-child{margin-bottom:0;}
.info-bullet{width:18px;height:18px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;margin-top:1px;}
.info-bullet.safety{background:#fde68a;color:#92400e;}.info-bullet.award{background:#bbf7d0;color:#14532d;}.info-bullet.emergency{background:#fecaca;color:#991b1b;}
.award-table{width:100%;border-collapse:collapse;font-size:12px;}
.award-table th{background:#f0f9f4;color:#14532d;padding:6px 10px;text-align:left;font-weight:700;border-bottom:1px solid #d1fae5;}
.award-table td{padding:6px 10px;border-bottom:1px solid var(--border);}
.award-table tr:last-child td{border-bottom:none;}
.info-edit-area{display:none;padding:10px 14px;border-top:1px solid var(--border);background:#f8f9fc;}
.info-edit-area.show{display:block;}
.info-edit-area textarea{width:100%;padding:8px 10px;border:1.5px solid var(--navy);border-radius:6px;font-size:12px;font-family:'Noto Sans KR',sans-serif;resize:vertical;min-height:100px;line-height:1.7;}
.info-edit-area .edit-actions{display:flex;gap:6px;justify-content:flex-end;margin-top:6px;}
.info-edit-area .btn-save{padding:6px 14px;background:var(--navy);color:var(--white);border:none;border-radius:5px;font-size:11px;font-weight:700;cursor:pointer;}
.info-edit-area .btn-cancel-sm{padding:6px 10px;background:var(--bg);color:var(--text2);border:none;border-radius:5px;font-size:11px;cursor:pointer;}
.info-edit-area .hint{font-size:10px;color:var(--text2);margin-bottom:6px;}

/* MODAL */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center;padding:16px;}
.modal-bg.show{display:flex;}
.modal{background:var(--card);border-radius:12px;padding:22px;max-width:440px;width:100%;max-height:90vh;overflow-y:auto;}
.modal h2{font-size:15px;font-weight:700;color:var(--navy);margin-bottom:12px;}
.modal input,.modal textarea,.modal select{width:100%;padding:7px 10px;border:1.5px solid var(--border);border-radius:6px;font-size:13px;font-family:'Noto Sans KR',sans-serif;margin-bottom:9px;}
.modal input:focus,.modal textarea:focus{outline:none;border-color:var(--navy);}
.modal label{font-size:11px;color:var(--text2);display:block;margin-bottom:3px;font-weight:600;}
.modal-btns{display:flex;gap:7px;justify-content:flex-end;margin-top:4px;}
.modal-btns button{padding:7px 14px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;border:none;}
.btn-cancel{background:var(--bg);color:var(--text);}
.btn-confirm{background:var(--navy);color:var(--white);}
.btn-danger{background:#fee2e2;color:#991b1b;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:var(--white);padding:9px 18px;border-radius:8px;font-size:12px;font-weight:700;z-index:300;display:none;}
</style>

<div class="top-nav">
  <div class="logo-area">
    <div class="logo-badge">HS</div>
    <div class="logo-text">한수컵 2026<span>HANSU MIDDLE SCHOOL</span></div>
  </div>
  <div class="nav-tabs">
    <button class="nav-tab active" onclick="showPage('home',this)">🏠 홈</button>
    <button class="nav-tab" onclick="showPage('bracket1',this)">⚽ 1학년</button>
    <button class="nav-tab" onclick="showPage('bracket2',this)">🤾 2학년</button>
    <button class="nav-tab" onclick="showPage('bracket3',this)">🏐 3학년</button>
    <button class="nav-tab" onclick="showPage('rules',this)">📋 경기 요강</button>
    <button class="nav-tab" onclick="showPage('board',this)">📢 게시판</button>
  </div>
  <button class="admin-btn" id="adminToggleBtn" onclick="openAdminModal()">🔒 관리자</button>
</div>

<div class="page active" id="page-home"></div>
<div class="page" id="page-bracket1"></div>
<div class="page" id="page-bracket2"></div>
<div class="page" id="page-bracket3"></div>

<!-- RULES PAGE -->
<div class="page" id="page-rules">

<script>
const ADMIN_PASS='1234';
let isAdmin=false;
const gradeInfo={1:{name:'1학년',sport:'풋살',icon:'⚽',schedLabel:'1학년 풋살 경기 일정'},2:{name:'2학년',sport:'츄크볼',icon:'🤾',schedLabel:'2학년 츄크볼 경기 일정'},3:{name:'3학년',sport:'배구',icon:'🏐',schedLabel:'3학년 배구 경기 일정'}};

/* ── CALENDAR ── */
let calYear=2026, calMonth=4; // 0-indexed month, so 4 = May
let calEvents = [
  {id:1,date:'2026-05-19',title:'1학년 풋살 1라운드',type:'ev-futsal',note:'운동장'},
  {id:2,date:'2026-05-19',title:'풋살 8강',type:'ev-futsal',note:''},
  {id:3,date:'2026-05-20',title:'2학년 츄크볼 1라운드',type:'ev-tchouk',note:'체육관'},
  {id:4,date:'2026-05-22',title:'3학년 배구 1라운드',type:'ev-volleyball',note:'체육관'},
  {id:5,date:'2026-05-26',title:'풋살 8강',type:'ev-futsal',note:''},
  {id:6,date:'2026-06-02',title:'풋살 4강',type:'ev-futsal',note:''},
  {id:7,date:'2026-06-09',title:'풋살 결승전',type:'ev-futsal',note:''},
  {id:8,date:'2026-06-09',title:'2학년 츄크볼 8강',type:'ev-tchouk',note:''},
  {id:9,date:'2026-06-13',title:'한수컵 시상식',type:'ev-special',note:'강당'},
];
let nextCalId=20;

const monthNames=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
const dayNames=['일','월','화','수','목','금','토'];
const typeLabels={'ev-futsal':'⚽ 풋살','ev-tchouk':'🤾 츄크볼','ev-volleyball':'🏐 배구','ev-special':'✨ 특별','ev-general':'📋 일반'};

function renderCalendar(){
  const today=new Date();
  const firstDay=new Date(calYear,calMonth,1).getDay();
  const daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  const todayStr=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;

  // group events by date
  const evMap={};
  calEvents.forEach(ev=>{if(!evMap[ev.date])evMap[ev.date]=[];evMap[ev.date].push(ev);});

  let cells='';
  for(let i=0;i<firstDay;i++) cells+=`<div class="cal-cell empty"></div>`;
  for(let d=1;d<=daysInMonth;d++){
    const dow=(firstDay+d-1)%7;
    const dateStr=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday=dateStr===todayStr;
    const cls=['cal-cell',isToday?'today':'',dow===0?'sunday':dow===6?'saturday':''].filter(Boolean).join(' ');
    const evs=evMap[dateStr]||[];
    const maxShow=2;
    const evHtml=evs.slice(0,maxShow).map(ev=>{
      const delBtn=`<button class="ev-del" onclick="deleteCalEvent(${ev.id});event.stopPropagation()">✕</button>`;
      return `<div class="cal-event ${ev.type}" title="${ev.title}${ev.note?' — '+ev.note:''}" onclick="${isAdmin?`openEditCalEvent(${ev.id})`:''}">
        ${ev.title.length>8?ev.title.substring(0,8)+'…':ev.title}${delBtn}</div>`;
    }).join('');
    const more=evs.length>maxShow?`<div class="cal-more">+${evs.length-maxShow}개 더</div>`:'';
    const addBtn=isAdmin?`<div style="position:absolute;bottom:2px;right:2px;"><button style="background:none;border:none;color:#c0c8e0;font-size:14px;cursor:pointer;line-height:1;" onclick="openAddCalEvent('${dateStr}')" title="일정 추가">+</button></div>`:'';
    cells+=`<div class="${cls}">${addBtn}<div class="cal-date">${d}</div>${evHtml}${more}</div>`;
  }

  const addBtnHeader=isAdmin?`<button class="cal-add-btn show" onclick="openAddCalEvent('')">+ 일정 추가</button>`:'';

  return `<div class="cal-wrap ${isAdmin?'admin-mode':''}">
    <div class="cal-header">
      <button class="cal-nav-btn" onclick="calNav(-1)">‹</button>
      <span class="cal-month-title">${calYear}년 ${monthNames[calMonth]}</span>
      <div style="display:flex;gap:6px;align-items:center;">${addBtnHeader}<button class="cal-nav-btn" onclick="calNav(1)">›</button></div>
    </div>
    <div class="cal-grid-header">${dayNames.map(d=>`<div class="cal-day-name">${d}</div>`).join('')}</div>
    <div class="cal-grid">${cells}</div>
    <div class="cal-legend">
      <div class="leg-item"><div class="leg-dot ev-futsal"></div>풋살</div>
      <div class="leg-item"><div class="leg-dot ev-tchouk"></div>츄크볼</div>
      <div class="leg-item"><div class="leg-dot ev-volleyball"></div>배구</div>
      <div class="leg-item"><div class="leg-dot ev-special"></div>특별 행사</div>
      <div class="leg-item"><div class="leg-dot ev-general"></div>일반</div>
    </div>
  </div>`;
}

function calNav(dir){
  calMonth+=dir;
  if(calMonth<0){calMonth=11;calYear--;}
  if(calMonth>11){calMonth=0;calYear++;}
  renderHome();
}
function openAddCalEvent(dateStr){
  document.getElementById('ceId').value='';
  document.getElementById('ceDate').value=dateStr||'';
  document.getElementById('ceTitle').value='';
  document.getElementById('ceType').value='ev-futsal';
  document.getElementById('ceNote').value='';
  document.getElementById('calEventModalTitle').textContent='📅 일정 추가';
  document.getElementById('calEventModal').classList.add('show');
}
function openEditCalEvent(id){
  const ev=calEvents.find(e=>e.id===id);if(!ev)return;
  document.getElementById('ceId').value=id;
  document.getElementById('ceDate').value=ev.date;
  document.getElementById('ceTitle').value=ev.title;
  document.getElementById('ceType').value=ev.type;
  document.getElementById('ceNote').value=ev.note;
  document.getElementById('calEventModalTitle').textContent='📅 일정 수정';
  document.getElementById('calEventModal').classList.add('show');
}
function saveCalEvent(){
  const id=document.getElementById('ceId').value;
  const ev={date:document.getElementById('ceDate').value,title:document.getElementById('ceTitle').value.trim(),type:document.getElementById('ceType').value,note:document.getElementById('ceNote').value.trim()};
  if(!ev.date||!ev.title){showToast('날짜와 제목을 입력해 주세요.');return;}
  if(id){const e=calEvents.find(x=>x.id===+id);if(e)Object.assign(e,ev);}
  else{ev.id=nextCalId++;calEvents.push(ev);}
  closeModal('calEventModal');renderHome();showToast(id?'일정이 수정되었습니다!':'일정이 추가되었습니다!');
}
function deleteCalEvent(id){
  calEvents=calEvents.filter(e=>e.id!==id);renderHome();showToast('일정이 삭제되었습니다.');
}

/* ── RULES DATA ── */

  {title:'🏐 배구 경기 요강 (3학년)', body:`■ 경기 방식

];
let activeRulesIdx=0;

function renderRulesCard(){
  const r=rulesData[activeRulesIdx];
  const editBtn=isAdmin?`<button class="rules-edit-btn show" onclick="toggleRulesEdit()">✏️ 수정</button>`:`<button class="rules-edit-btn" style="display:none;"></button>`;
  document.getElementById('rulesCardContainer').innerHTML=`
  <div class="rules-card active">
    <div class="rules-card-header">
      <div class="rules-card-title">${r.title}</div>
      ${editBtn}
    </div>
    <div class="rules-content" id="rulesContent">${r.body}</div>
    <div class="rules-edit-area" id="rulesEditArea">
      <input class="rules-title-inp" type="text" id="rulesTitleInp" value="${r.title.replace(/"/g,'&quot;')}">
      <textarea class="rules-body-ta" id="rulesBodyTa">${r.body}</textarea>
      <div class="rules-edit-actions">
        <button class="rules-cancel-btn" onclick="cancelRulesEdit()">취소</button>
        <button class="rules-save-btn" onclick="saveRulesEdit()">저장</button>
      </div>
    </div>
  </div>`;
}

function showRules(idx,btn){
  activeRulesIdx=idx;
  document.querySelectorAll('.rules-tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  renderRulesCard();
}
function toggleRulesEdit(){
  const area=document.getElementById('rulesEditArea');
  area.classList.toggle('show');
  if(area.classList.contains('show')){
    document.getElementById('rulesTitleInp').value=rulesData[activeRulesIdx].title;
    document.getElementById('rulesBodyTa').value=rulesData[activeRulesIdx].body;
  }
}
function cancelRulesEdit(){document.getElementById('rulesEditArea').classList.remove('show');}
function saveRulesEdit(){
  rulesData[activeRulesIdx].title=document.getElementById('rulesTitleInp').value.trim()||rulesData[activeRulesIdx].title;
  rulesData[activeRulesIdx].body=document.getElementById('rulesBodyTa').value;
  renderRulesCard();showToast('요강이 저장되었습니다!');
}

  else if(type==='emergency'){bodyEl.innerHTML=infoData.emergency.map((row,i)=>{const idx=row.indexOf('|');return`<div class="info-item"><div class="info-bullet emergency">${['①','②','③','④'][i]}</div><div><b>${row.substring(0,idx)}</b>: ${row.substring(idx+1)}</div></div>`;}).join('')+`<div style="margin-top:10px;background:#fef2f2;border-radius:6px;padding:8px 10px;font-size:11px;color:#991b1b;font-weight:700;line-height:1.7;">🆘 비상연락: 담당 교사 → 보건 교사 → 관리자 → 119</div>`;}

const roundStatusClass={완료:'rsb-done',진행중:'rsb-ongoing',예정:'rsb-scheduled'};
function renderSchedule(g){
  const rounds=schedules[g]||[];
  if(!rounds.length)return`<p style="font-size:12px;color:var(--text2);padding:6px 0;">등록된 일정이 없습니다.${isAdmin?' 라운드를 추가하세요.':''}</p>`;
  let html='<div class="sched-wrap">';
  rounds.forEach((rnd,ri)=>{
    const sc=roundStatusClass[rnd.status]||'rsb-scheduled';
    const rows=rnd.games.map((gm,gi)=>{const adm=isAdmin?`<td><button class="edit-game-btn" onclick="openEditGame(${g},${ri},${gi});event.stopPropagation()">수정</button> <button class="del-game-btn" onclick="deleteGame(${g},${ri},${gi});event.stopPropagation()">삭제</button></td>`:''
      ;return`<tr><td>${gm.date}</td><td>${gm.time}</td><td>${gm.venue}</td><td class="vs-cell">${gm.home} vs ${gm.away}</td><td style="font-size:11px;color:var(--text2);">${gm.note}</td>${adm}</tr>`;}).join('');
    const adminBar=isAdmin?`<div class="admin-game-bar"><button class="add-game-btn" onclick="openAddGame(${g},${ri})">+ 경기 추가</button><button class="del-round-btn" onclick="deleteRound(${g},${ri})">라운드 삭제</button></div>`:'';
    html+=`<div class="round-block"><div class="round-block-header" onclick="toggleRound(this)"><div class="round-block-title"><span>${rnd.roundName}</span><span class="round-status-badge ${sc}">${rnd.status}</span><span style="font-size:11px;color:var(--text2);font-weight:400;">${rnd.games.length}경기</span></div><span class="round-toggle ${ri===0?'open':''}">▼</span></div><div class="round-body ${ri===0?'open':''}"><div style="overflow-x:auto;"><table class="sched-table"><thead><tr><th>날짜</th><th>시간</th><th>장소</th><th>대전</th><th>메모</th>${isAdmin?'<th>관리</th>':''}</tr></thead><tbody>${rows}</tbody></table></div>${adminBar}</div></div>`;
  });
  if(isAdmin)html+=`<button class="add-round-btn" onclick="openAddRound(${g})">📅 라운드 추가</button>`;

}

/* ── TOURNAMENT ── */
function makeTeams(g){return Array.from({length:10},(_,i)=>({id:i+1,name:`${i+1}반`}));}
function initTournament(g){const t=makeTeams(g);return{teams:t,rounds:{r1:[{id:`${g}_r1_1`,round:'1라운드',home:t[6],away:t[9],homeScore:null,awayScore:null,status:'scheduled',winner:null,date:''},{id:`${g}_r1_2`,round:'1라운드',home:t[7],away:t[8],homeScore:null,awayScore:null,status:'scheduled',winner:null,date:''}],qf:[{id:`${g}_qf_1`,round:'8강',home:t[0],away:null,homeScore:null,awayScore:null,status:'scheduled',winner:null,date:''},{id:`${g}_qf_2`,round:'8강',home:t[1],away:null,homeScore:null,awayScore:null,status:'scheduled',winner:null,date:''},{id:`${g}_qf_3`,round:'8강',home:t[2],away:t[5],homeScore:null,awayScore:null,status:'scheduled',winner:null,date:''},{id:`${g}_qf_4`,round:'8강',home:t[3],away:t[4],homeScore:null,awayScore:null,status:'scheduled',winner:null,date:''}],sf:[{id:`${g}_sf_1`,round:'4강',home:null,away:null,homeScore:null,awayScore:null,status:'scheduled',winner:null,date:''},{id:`${g}_sf_2`,round:'4강',home:null,away:null,homeScore:null,awayScore:null,status:'scheduled',winner:null,date:''}],third:[{id:`${g}_3rd_1`,round:'3·4위전',home:null,away:null,homeScore:null,awayScore:null,status:'scheduled',winner:null,date:''}],final:[{id:`${g}_f_1`,round:'결승전',home:null,away:null,homeScore:null,awayScore:null,status:'scheduled',winner:null,date:''}]}};}
let tournaments={1:initTournament(1),2:initTournament(2),3:initTournament(3)};
function propagate(g){const R=tournaments[g].rounds;R.qf[0].away=R.r1[1].winner||null;R.qf[1].away=R.r1[0].winner||null;R.sf[0].home=R.qf[0].winner||null;R.sf[0].away=R.qf[3].winner||null;R.sf[1].home=R.qf[1].winner||null;R.sf[1].away=R.qf[2].winner||null;R.final[0].home=R.sf[0].winner||null;R.final[0].away=R.sf[1].winner||null;const l0=R.sf[0].status==='done'?(R.sf[0].winner===R.sf[0].home?R.sf[0].away:R.sf[0].home):null;const l1=R.sf[1].status==='done'?(R.sf[1].winner===R.sf[1].home?R.sf[1].away:R.sf[1].home):null;R.third[0].home=l0;R.third[0].away=l1;}
function demoScores(){const R=tournaments[1].rounds;const sw=(m,h,a,d)=>{m.homeScore=h;m.awayScore=a;m.status='done';m.winner=h>a?m.home:m.away;m.date=d;};sw(R.r1[0],2,1,'5월 19일');sw(R.r1[1],1,3,'5월 19일');propagate(1);sw(R.qf[0],3,1,'5월 26일');sw(R.qf[1],2,0,'5월 26일');R.qf[2].status='playing';R.qf[2].homeScore=1;R.qf[2].awayScore=1;R.qf[2].date='5월 26일';propagate(1);}
demoScores();
function teamLabel(t){return t?t.name:'TBD';}
function matchNodeHTML(m,g){
  const hWin=m.status==='done'&&m.winner===m.home,aWin=m.status==='done'&&m.winner===m.away;
  const statusTxt=m.status==='scheduled'?'예정':m.status==='playing'?'진행중':'완료';
  const pillCls=m.status==='done'?'pill-done':m.status==='playing'?'pill-playing':'pill-scheduled';
  const hNm=teamLabel(m.home),aNm=teamLabel(m.away);
  const adminBtn=isAdmin?`<button class="edit-btn-small" onclick="toggleEdit('${m.id}')">✏️</button>`:'';
  const ep=isAdmin?`<div class="edit-panel" id="edit_${m.id}">
    <div class="edit-row"><span class="edit-label" style="color:var(--navy);font-weight:700;font-size:11px;min-width:auto;">팀명</span></div>
    <div class="edit-row"><span class="edit-label">홈</span><input class="team-inp" type="text" id="hn_${m.id}" value="${hNm==='TBD'?'':hNm}" placeholder="예) 3반"></div>
    <div class="edit-row"><span class="edit-label">원정</span><input class="team-inp" type="text" id="an_${m.id}" value="${aNm==='TBD'?'':aNm}" placeholder="예) 7반"></div>
    <div class="edit-divider">날짜 / 점수 / 상태</div>
    <div class="edit-row"><span class="edit-label">날짜</span><input class="date-inp" type="text" id="dt_${m.id}" value="${m.date||''}" placeholder="예) 5월 26일 월요일"></div>
    <div class="edit-row"><span class="edit-label">${hNm}</span><input class="sc-inp" type="number" min="0" max="99" id="hs_${m.id}" value="${m.homeScore??''}"><span style="font-weight:700;color:var(--text2)">:</span><input class="sc-inp" type="number" min="0" max="99" id="as_${m.id}" value="${m.awayScore??''}"><span class="edit-label">${aNm}</span><select class="st-sel" id="st_${m.id}"><option value="scheduled" ${m.status==='scheduled'?'selected':''}>예정</option><option value="playing" ${m.status==='playing'?'selected':''}>진행중</option><option value="done" ${m.status==='done'?'selected':''}>완료</option></select></div>
    <div class="edit-row" style="justify-content:flex-end;"><button class="save-btn" onclick="saveMatch('${m.id}',${g})">💾 저장</button></div>
  </div>`:'';
  return `<div class="match-node ${m.status==='playing'?'current-game':''}" id="node_${m.id}"><div class="match-top"><div class="match-round-row"><span class="match-round-label">${m.round}</span><span style="display:flex;align-items:center;gap:3px;"><span class="match-status-pill ${pillCls}">${statusTxt}</span>${adminBtn}</span></div>${m.date?`<div class="match-date-row">📅 ${m.date}</div>`:'<div class="match-date-row" style="color:#c8c8d4;">날짜 미정</div>'}</div><div class="team-row ${hWin?'winner':m.status==='done'?'loser':''}"><div class="team-nm">${hNm}</div><div class="team-sc ${hWin?'win-sc':''}">${m.homeScore!==null?m.homeScore:'-'}</div></div><div class="team-row ${aWin?'winner':m.status==='done'?'loser':''}"><div class="team-nm">${aNm}</div><div class="team-sc ${aWin?'win-sc':''}">${m.awayScore!==null?m.awayScore:'-'}</div></div>${ep}</div>`;
}
function toggleEdit(id){document.getElementById('edit_'+id)?.classList.toggle('show');}
function saveMatch(id,g){const R=tournaments[g].rounds,allM=[...R.r1,...R.qf,...R.sf,...R.third,...R.final],m=allM.find(x=>x.id===id);if(!m)return;const hn=document.getElementById('hn_'+id)?.value.trim(),an=document.getElementById('an_'+id)?.value.trim();if(hn&&m.home)m.home.name=hn;if(an&&m.away)m.away.name=an;m.date=document.getElementById('dt_'+id).value.trim();const hs=document.getElementById('hs_'+id).value,as=document.getElementById('as_'+id).value,st=document.getElementById('st_'+id).value;m.homeScore=hs===''?null:+hs;m.awayScore=as===''?null:+as;m.status=st;if(st==='done'&&m.homeScore!==null&&m.awayScore!==null)m.winner=m.homeScore>m.awayScore?m.home:(m.awayScore>m.homeScore?m.away:null);else m.winner=null;propagate(g);renderBracket(g);renderHome();showToast('저장됨!');}
function renderBracket(g){propagate(g);const T=tournaments[g],R=T.rounds,info=gradeInfo[g];const allM=[...R.r1,...R.qf,...R.sf,...R.third,...R.final],done=allM.filter(m=>m.status==='done').length;const f=R.final[0];let champ='',second='',third='';if(f.status==='done'&&f.winner){champ=f.winner.name;second=(f.winner===f.home?f.away:f.home)?.name||'';}if(R.third[0].status==='done'&&R.third[0].winner)third=R.third[0].winner.name;const podium=(champ||second||third)?`<div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;">${champ?`<div class="summary-card" style="border-color:var(--gold);flex:1;min-width:90px;"><div style="font-size:16px;">🥇</div><div class="num" style="font-size:18px;">${champ}</div><div class="lbl">우승</div></div>`:''} ${second?`<div class="summary-card" style="flex:1;min-width:90px;"><div style="font-size:16px;">🥈</div><div class="num" style="font-size:18px;">${second}</div><div class="lbl">준우승</div></div>`:''} ${third?`<div class="summary-card" style="flex:1;min-width:90px;"><div style="font-size:16px;">🥉</div><div class="num" style="font-size:18px;">${third}</div><div class="lbl">3위</div></div>`:''}</div>`:'';const rl=s=>`<div style="text-align:center;font-size:11px;font-weight:700;padding:5px 8px;border-radius:6px 6px 0 0;margin:0 5px;${s==='결승전'?'background:var(--gold);color:var(--navy-dark);':'background:var(--navy);color:var(--white);'}">${s==='결승전'?'🏆 결승전':s}</div>`;document.getElementById('page-bracket'+g).innerHTML=`<div class="bracket-header"><div class="grade-badge">${info.icon} ${info.name}</div><div class="sport-badge">${info.sport}</div><div style="font-size:12px;color:var(--text2);margin-left:auto;">${done}/9 완료</div></div>${podium}<div class="section-title" style="margin-top:0">토너먼트 대진표</div><div class="bracket-wrap"><div style="display:grid;grid-template-columns:repeat(5,minmax(160px,1fr));align-items:start;"><div>${rl('1라운드')}<div style="padding:4px;">${R.r1.map(m=>matchNodeHTML(m,g)).join('')}</div></div><div>${rl('8강')}<div style="padding:4px;">${R.qf.map(m=>matchNodeHTML(m,g)).join('')}</div></div><div>${rl('4강')}<div style="padding:4px;">${R.sf.map(m=>matchNodeHTML(m,g)).join('')}</div></div><div>${rl('3·4위전')}<div style="padding:4px;">${R.third.map(m=>matchNodeHTML(m,g)).join('')}</div></div><div>${rl('결승전')}<div style="padding:4px;">${R.final.map(m=>matchNodeHTML(m,g)).join('')}</div></div></div></div><div class="section-title">${info.schedLabel}</div>${renderSchedule(g)}`;}

/* ── HOME ── */
function renderHome(){
  let done=0,playing=0,sched=0;
  [1,2,3].forEach(g=>{const R=tournaments[g].rounds;[...R.r1,...R.qf,...R.sf,...R.third,...R.final].forEach(m=>{if(m.status==='done')done++;else if(m.status==='playing')playing++;else sched++;});});
  const tops=[];[1,2,3].forEach(g=>{const f=tournaments[g].rounds.final[0];if(f.status==='done'&&f.winner)tops.push({grade:g,team:f.winner.name});});
  document.getElementById('page-home').innerHTML=`
  <div class="hero"><div class="hero-title">2026 한수컵</div><div class="hero-sub">한수중학교 스포츠클럽 대회</div>
    <div class="hero-meta"><div class="hero-badge">📅 2026년 봄학기</div><div class="hero-badge">👥 3학년 30반 참가</div><div class="hero-badge">🏆 토너먼트 9경기</div></div>
  </div>
  <div class="summary-grid">
    <div class="summary-card"><div class="num">${done+playing+sched}</div><div class="lbl">전체 경기</div></div>
    <div class="summary-card"><div class="num">${done}</div><div class="lbl">완료</div></div>
    <div class="summary-card" style="border-color:var(--gold)"><div class="num" style="color:var(--gold)">${playing}</div><div class="lbl">진행중</div></div>
    <div class="summary-card"><div class="num">${sched}</div><div class="lbl">예정</div></div>
  </div>
  <div class="section-title">학년별 종목</div>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:4px;">
    ${[1,2,3].map(g=>`<div class="summary-card" style="cursor:pointer;" onclick="goGrade(${g})"><div style="font-size:22px;">${gradeInfo[g].icon}</div><div style="font-size:13px;font-weight:700;color:var(--navy);margin-top:4px;">${gradeInfo[g].name}</div><div style="font-size:11px;color:var(--text2);">${gradeInfo[g].sport}</div></div>`).join('')}
  </div>
  <div class="section-title">대회 일정 달력</div>
  ${renderCalendar()}
  ${tops.length?`<div class="section-title">🏆 우승팀</div><div style="display:flex;gap:8px;flex-wrap:wrap;">${tops.map(t=>`<div class="summary-card" style="border-color:var(--gold);flex:1;min-width:120px;"><div style="font-size:12px;color:var(--text2);">${gradeInfo[t.grade].name}</div><div class="num" style="font-size:20px;">${t.team}</div><div class="lbl">🏆 우승</div></div>`).join('')}</div>`:''}`;
}

/* ── BOARD ── */
let noticePosts=[{id:1,type:'notice',cat:'공지',field1:'2026 한수컵 대회 일정 최종 안내',field2:'체육부',field3:'1학년 풋살: 운동장\n2학년 츄크볼: 체육관\n3학년 배구: 체육관\n경기 15분 전까지 집합 바랍니다.',date:'2026-05-01'},{id:2,type:'notice',cat:'안내',field1:'선수 명단 제출 마감 안내',field2:'체육부',field3:'각 반 담임 선생님께서는 선수 명단을 5월 15일까지 제출해 주세요.',date:'2026-05-05'}];
let studentPosts=[{id:101,type:'student',cat:'응원',field1:'10301',field2:'김민준',field3:'1학년 3반 풋살 파이팅!! 🔥 우리 반 최고야!',date:'2026-05-10'},{id:102,type:'student',cat:'응원',field1:'30702',field2:'박서윤',field3:'3학년 7반 배구 화이팅!!',date:'2026-05-11'}];
let nextNoticeId=10,nextStudentId=200,_writeTarget='student';
function renderBoard(){
  const nb=document.getElementById('noticeWriteBtn');if(nb)nb.style.display=isAdmin?'inline-block':'none';
  document.getElementById('noticeList').innerHTML=noticePosts.length?noticePosts.slice().reverse().map(p=>`<div class="post-item"><div style="display:flex;align-items:center;gap:6px;margin-bottom:2px;"><span class="post-badge">📢 ${p.cat}</span><div class="post-title-sm" onclick="viewPost(${p.id},'notice')">${p.field1}</div></div><div class="post-meta-sm"><span>${p.field2}</span><span>${p.date}</span><div class="post-actions ${isAdmin?'show':''}"><button class="act-btn act-edit" onclick="openEditPostModal(${p.id},'notice')">수정</button><button class="act-btn act-del" onclick="confirmDelete(${p.id},'notice')">삭제</button></div></div></div>`).join(''):`<div class="empty-msg">공지사항이 없습니다.</div>`;
  document.getElementById('studentList').innerHTML=studentPosts.length?studentPosts.slice().reverse().map(p=>`<div class="post-item"><div style="display:flex;align-items:center;gap:6px;margin-bottom:2px;"><span class="post-badge">${p.cat==='응원'?'🎉':p.cat==='문의'?'❓':'💬'} ${p.cat}</span><div class="post-title-sm" onclick="viewPost(${p.id},'student')">${p.field3.length>22?p.field3.substring(0,22)+'…':p.field3}</div></div><div class="post-meta-sm"><span style="font-weight:700">학번 ${p.field1}</span><span>${p.field2}</span><span>${p.date}</span><div class="post-actions ${isAdmin?'show':''}"><button class="act-btn act-edit" onclick="openEditPostModal(${p.id},'student')">수정</button><button class="act-btn act-del" onclick="confirmDelete(${p.id},'student')">삭제</button></div></div></div>`).join(''):`<div class="empty-msg">게시글이 없습니다.</div>`;
}
function openWriteModal(target){_writeTarget=target;const isN=target==='notice';document.getElementById('writeModalTitle').textContent=isN?'📢 공지사항 작성':'💬 학생 게시판 글쓰기';document.getElementById('labelField1').textContent=isN?'제목':'학번';document.getElementById('labelField2').textContent=isN?'작성자':'이름';document.getElementById('labelField3').textContent='내용';document.getElementById('postField1').placeholder=isN?'제목':'예) 10301';document.getElementById('postField2').placeholder=isN?'예) 체육부':'예) 김민준';document.getElementById('postField3').placeholder='내용을 입력하세요';['postField1','postField2','postField3'].forEach(id=>document.getElementById(id).value='');document.getElementById('writeModal').classList.add('show');}
function submitPost(){const f1=document.getElementById('postField1').value.trim(),f2=document.getElementById('postField2').value.trim(),f3=document.getElementById('postField3').value.trim();if(!f1||!f3){showToast(_writeTarget==='notice'?'제목과 내용을 입력해 주세요.':'학번과 내용을 입력해 주세요.');return;}const d=new Date(),ds=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const post={type:_writeTarget,cat:_writeTarget==='notice'?'공지':'응원',field1:f1,field2:f2||(_writeTarget==='notice'?'작성자':'익명'),field3:f3,date:ds};if(_writeTarget==='notice'){post.id=nextNoticeId++;noticePosts.push(post);}else{post.id=nextStudentId++;studentPosts.push(post);}closeModal('writeModal');renderBoard();showToast('등록됨!');}
function openEditPostModal(id,type){const list=type==='notice'?noticePosts:studentPosts,p=list.find(x=>x.id===id);if(!p)return;const isN=type==='notice';document.getElementById('editPostId').value=id;document.getElementById('editPostType').value=type;document.getElementById('editLabelField1').textContent=isN?'제목':'학번';document.getElementById('editLabelField2').textContent=isN?'작성자':'이름';document.getElementById('editLabelField3').textContent='내용';document.getElementById('editPostField1').value=p.field1;document.getElementById('editPostField2').value=p.field2;document.getElementById('editPostField3').value=p.field3;document.getElementById('editPostModal').classList.add('show');}
function saveEditPost(){const id=+document.getElementById('editPostId').value,type=document.getElementById('editPostType').value;const list=type==='notice'?noticePosts:studentPosts,p=list.find(x=>x.id===id);if(!p)return;p.field1=document.getElementById('editPostField1').value.trim()||p.field1;p.field2=document.getElementById('editPostField2').value.trim()||p.field2;p.field3=document.getElementById('editPostField3').value.trim()||p.field3;closeModal('editPostModal');renderBoard();showToast('수정됨!');}
function viewPost(id,type){const list=type==='notice'?noticePosts:studentPosts,p=list.find(x=>x.id===id);if(!p)return;const isN=type==='notice';document.getElementById('pvTitle').textContent=isN?p.field1:`${p.field2} (학번: ${p.field1})`;document.getElementById('pvMeta').textContent=isN?`${p.field2} · ${p.date}`:`학번: ${p.field1} · 이름: ${p.field2} · ${p.date}`;document.getElementById('pvBody').textContent=p.field3;document.getElementById('postViewModal').classList.add('show');}
function confirmDelete(id,type){const list=type==='notice'?noticePosts:studentPosts,p=list.find(x=>x.id===id);if(!p)return;document.getElementById('confirmMsg').textContent='이 게시글을 삭제하시겠습니까?';document.getElementById('confirmOkBtn').onclick=()=>{if(type==='notice')noticePosts=noticePosts.filter(x=>x.id!==id);else studentPosts=studentPosts.filter(x=>x.id!==id);closeModal('confirmModal');renderBoard();showToast('삭제됨.');};document.getElementById('confirmModal').classList.add('show');}

/* ── ADMIN ── */
function openAdminModal(){
  if(isAdmin){isAdmin=false;document.getElementById('adminToggleBtn').classList.remove('active-admin');document.getElementById('adminToggleBtn').textContent='🔒 관리자';updateAdminInfoBtns();[1,2,3].forEach(g=>{const c=document.getElementById('page-bracket'+g);if(c.innerHTML.trim())renderBracket(g);});renderBoard();renderHome();if(document.getElementById('page-rules').classList.contains('active'))renderRulesCard();showToast('관리자 모드 해제');return;}
  document.getElementById('adminPin').value='';document.getElementById('adminModal').classList.add('show');setTimeout(()=>document.getElementById('adminPin').focus(),100);
}
function checkAdmin(){
  if(document.getElementById('adminPin').value===ADMIN_PASS){isAdmin=true;closeModal('adminModal');document.getElementById('adminToggleBtn').classList.add('active-admin');document.getElementById('adminToggleBtn').textContent='🔓 관리자 모드';updateAdminInfoBtns();[1,2,3].forEach(g=>{const c=document.getElementById('page-bracket'+g);if(c.innerHTML.trim())renderBracket(g);});renderBoard();renderHome();if(document.getElementById('page-rules').classList.contains('active'))renderRulesCard();showToast('관리자 모드 활성화');}else{showToast('비밀번호가 틀렸습니다.');document.getElementById('adminPin').value='';}
}
function closeModal(id){document.getElementById(id).classList.remove('show');}
function showPage(name,btn){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));document.getElementById('page-'+name).classList.add('active');btn.classList.add('active');if(['bracket1','bracket2','bracket3'].includes(name))renderBracket(+name.slice(-1));if(name==='home')renderHome();if(name==='board')renderBoard();if(name==='rules')renderRulesCard();}
function goGrade(g){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.querySelectorAll('.nav-tab').forEach((t,i)=>{t.classList.remove('active');if(i===g)t.classList.add('active');});document.getElementById('page-bracket'+g).classList.add('active');renderBracket(g);}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>{t.style.display='none';},2500);}

renderHome();
renderRulesCard();
['safety','award','emergency'].forEach(t=>renderInfoCard(t));
</script>
