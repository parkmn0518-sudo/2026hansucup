<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한수컵 2026</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Bebas+Neue&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1a2a5e;--navy-dark:#0f1a3d;--navy-light:#2a3f8f;
  --gold:#c9952a;--gold-light:#f0c050;
  --white:#fff;--bg:#f4f5f8;--card:#fff;
  --text:#1a1a2e;--text2:#4a5580;--border:#d8dce8;
  --win:#16a34a;--loss:#dc2626;--radius:10px;
}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
.top-nav{background:var(--navy);padding:0 14px;display:flex;align-items:center;gap:10px;height:54px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.3);}
.logo-area{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.logo-badge{width:34px;height:34px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:17px;color:var(--navy-dark);}
.logo-text{color:var(--white);font-size:12px;font-weight:700;line-height:1.2;}
.logo-text span{display:block;font-size:10px;font-weight:400;color:rgba(255,255,255,.6);}
.nav-tabs{display:flex;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none;}
.nav-tabs::-webkit-scrollbar{display:none;}
.nav-tab{padding:7px 11px;border-radius:6px;color:rgba(255,255,255,.7);font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;border:none;background:none;transition:all .15s;}
.nav-tab:hover{color:var(--white);background:rgba(255,255,255,.1);}
.nav-tab.active{color:var(--gold-light);background:rgba(201,149,42,.2);font-weight:700;}
.admin-btn{padding:6px 10px;border-radius:6px;border:1px solid var(--gold);color:var(--gold-light);font-size:11px;font-weight:700;background:none;cursor:pointer;white-space:nowrap;transition:all .15s;}
.admin-btn:hover,.admin-btn.active-admin{background:var(--gold);color:var(--navy-dark);}
.page{display:none;padding:14px;max-width:980px;margin:0 auto;}
.page.active{display:block;}

/* HOME HERO */
.hero{background:var(--navy);border-radius:var(--radius);padding:20px 22px;margin-bottom:14px;position:relative;overflow:hidden;}
.hero::before{content:'';position:absolute;right:-20px;top:-20px;width:160px;height:160px;border-radius:50%;background:rgba(201,149,42,.1);pointer-events:none;}
.hero-title{font-family:'Bebas Neue',sans-serif;font-size:30px;color:var(--gold-light);letter-spacing:2px;}
.hero-sub{color:rgba(255,255,255,.8);font-size:13px;margin-top:3px;}
.hero-meta{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
.hero-badge{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:6px;padding:4px 10px;color:rgba(255,255,255,.9);font-size:11px;}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:14px;}
.summary-card{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);padding:12px;text-align:center;}
.summary-card .num{font-size:26px;font-weight:700;color:var(--navy);font-family:'Bebas Neue',sans-serif;}
.summary-card .lbl{font-size:11px;color:var(--text2);margin-top:1px;}
.section-title{font-size:13px;font-weight:700;color:var(--navy);margin:16px 0 8px;padding-left:9px;border-left:3px solid var(--gold);}

/* ── CALENDAR ── */
.cal-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:14px;}
.cal-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--navy);}
.cal-nav-btn{background:none;border:1px solid rgba(255,255,255,.3);color:var(--white);border-radius:5px;width:28px;height:28px;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.cal-nav-btn:hover{background:rgba(255,255,255,.15);}
.cal-month-title{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--gold-light);letter-spacing:1px;}
.cal-add-btn{padding:4px 10px;background:var(--gold);color:var(--navy-dark);border:none;border-radius:5px;font-size:11px;font-weight:700;cursor:pointer;display:none;}
.cal-add-btn.show{display:block;}
.cal-grid-header{display:grid;grid-template-columns:repeat(7,1fr);background:#f0f2f8;}
.cal-day-name{text-align:center;padding:6px 0;font-size:11px;font-weight:700;color:var(--text2);}
.cal-day-name:first-child{color:#e53e3e;}
.cal-day-name:last-child{color:#3182ce;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--border);}
.cal-cell{min-height:64px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:4px;position:relative;vertical-align:top;}
.cal-cell:nth-child(7n){border-right:none;}
.cal-cell.empty{background:#f9fafb;}
.cal-cell.today{background:#fffbf0;}
.cal-cell.today .cal-date{background:var(--navy);color:var(--white);border-radius:50%;}
.cal-date{width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--text);margin-bottom:2px;}
.cal-cell.sunday .cal-date{color:#e53e3e;}
.cal-cell.saturday .cal-date{color:#3182ce;}
.cal-event{font-size:10px;line-height:1.3;padding:1px 4px;border-radius:3px;margin-bottom:2px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
.ev-futsal{background:#dbeafe;color:#1e40af;}
.ev-tchouk{background:#dcfce7;color:#14532d;}
.ev-volleyball{background:#fef3c7;color:#92400e;}
.ev-special{background:#f3e8ff;color:#6b21a8;}
.ev-general{background:#e0e4f0;color:var(--navy);}
.cal-more{font-size:9px;color:var(--text2);padding-left:4px;}
.ev-del{display:none;background:#fee2e2;color:#991b1b;border:none;border-radius:2px;font-size:9px;font-weight:700;cursor:pointer;padding:0 3px;margin-left:2px;vertical-align:middle;}
.admin-mode .ev-del{display:inline;}
.cal-legend{display:flex;gap:10px;flex-wrap:wrap;padding:8px 14px;border-top:1px solid var(--border);background:#f9fafb;}
.leg-item{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--text2);}
.leg-dot{width:10px;height:10px;border-radius:2px;}

/* BRACKET */
.bracket-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.grade-badge{padding:6px 16px;border-radius:20px;background:var(--navy);color:var(--white);font-size:13px;font-weight:700;}
.sport-badge{padding:6px 14px;border-radius:20px;background:var(--gold);color:var(--navy-dark);font-size:13px;font-weight:700;}
.bracket-wrap{overflow-x:auto;padding-bottom:8px;}
.match-node{background:var(--card);border:1.5px solid var(--border);border-radius:8px;margin:5px;overflow:hidden;min-width:155px;}
.match-node.current-game{border-color:var(--gold);box-shadow:0 0 0 2px rgba(201,149,42,.2);}
.match-top{background:#f0f2f8;border-bottom:1px solid var(--border);padding:4px 8px;}
.match-round-row{display:flex;align-items:center;justify-content:space-between;gap:4px;}
.match-round-label{font-size:10px;font-weight:700;color:var(--navy);}
.match-status-pill{font-size:9px;font-weight:700;padding:1px 6px;border-radius:8px;}
.pill-scheduled{background:#e0e4f0;color:var(--navy);}
.pill-playing{background:#fef3c7;color:#92400e;animation:blink 1s infinite;}
.pill-done{background:#dcfce7;color:#14532d;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
.match-date-row{font-size:9px;color:var(--text2);margin-top:2px;}
.team-row{display:flex;align-items:center;padding:8px 10px;border-bottom:1px solid var(--border);}
.team-row:last-of-type{border-bottom:none;}
.team-row.winner{background:#f0fdf4;}
.team-row.loser{opacity:.55;}
.team-nm{font-size:13px;font-weight:700;color:var(--text);flex:1;}
.team-sc{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--navy);min-width:22px;text-align:right;line-height:1;}
.team-sc.win-sc{color:var(--win);}
.edit-panel{background:#f8f9fc;border-top:1px solid var(--border);padding:10px 12px;display:none;flex-direction:column;gap:7px;}
.edit-panel.show{display:flex;}
.edit-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.edit-label{font-size:11px;color:var(--text2);min-width:28px;}
.team-inp{flex:1;min-width:80px;padding:5px 8px;border:1.5px solid var(--navy);border-radius:5px;font-size:12px;font-family:'Noto Sans KR',sans-serif;}
.date-inp{flex:1;min-width:110px;padding:5px 8px;border:1.5px solid var(--navy);border-radius:5px;font-size:11px;font-family:'Noto Sans KR',sans-serif;}
.sc-inp{width:50px;padding:5px 6px;border:1.5px solid var(--navy);border-radius:5px;font-size:14px;font-weight:700;text-align:center;}
.st-sel{padding:5px 7px;border:1.5px solid var(--navy);border-radius:5px;font-size:11px;font-family:'Noto Sans KR',sans-serif;}
.save-btn{padding:5px 14px;background:var(--navy);color:var(--white);border:none;border-radius:5px;font-size:11px;font-weight:700;cursor:pointer;}
.edit-btn-small{padding:3px 8px;background:none;border:1px solid var(--navy);border-radius:4px;font-size:10px;color:var(--navy);cursor:pointer;}
.edit-divider{font-size:10px;color:var(--text2);font-weight:700;border-top:1px solid var(--border);padding-top:6px;margin-top:2px;}

/* SCHEDULE */
.sched-wrap{margin-top:4px;}
.round-block{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;}
.round-block-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;cursor:pointer;user-select:none;}
.round-block-header:hover{background:#f8f9fc;}
.round-block-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--navy);}
.round-status-badge{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:700;}
.rsb-done{background:var(--win);color:#fff;}.rsb-ongoing{background:var(--gold);color:var(--navy-dark);}.rsb-scheduled{background:#e0e4f0;color:var(--navy);}
.round-toggle{font-size:12px;color:var(--text2);transition:transform .2s;}
.round-toggle.open{transform:rotate(180deg);}
.round-body{display:none;padding:10px 14px;}
.round-body.open{display:block;}
.sched-table{width:100%;border-collapse:collapse;font-size:12px;}
.sched-table th{background:var(--navy);color:var(--white);padding:7px 10px;text-align:center;font-weight:700;font-size:11px;}
.sched-table td{padding:7px 10px;text-align:center;border-bottom:1px solid var(--border);vertical-align:middle;}
.sched-table tr:last-child td{border-bottom:none;}
.sched-table tr:hover td{background:#f8f9fc;}
.vs-cell{font-weight:700;color:var(--text);}
.admin-game-bar{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;}
.add-game-btn{padding:5px 12px;background:var(--navy);color:var(--white);border:none;border-radius:5px;font-size:11px;font-weight:700;cursor:pointer;}
.del-round-btn{padding:5px 10px;background:#fee2e2;color:#991b1b;border:none;border-radius:5px;font-size:10px;font-weight:700;cursor:pointer;}
.add-round-btn{padding:7px 16px;background:var(--gold);color:var(--navy-dark);border:none;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;margin-top:6px;}
.del-game-btn{padding:2px 7px;background:#fee2e2;color:#991b1b;border:none;border-radius:4px;font-size:10px;font-weight:700;cursor:pointer;}
.edit-game-btn{padding:2px 7px;background:#e0e4f0;color:var(--navy);border:none;border-radius:4px;font-size:10px;font-weight:700;cursor:pointer;}

/* RULES */
.rules-tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
.rules-tab{padding:7px 16px;border-radius:var(--radius);border:1.5px solid var(--navy);color:var(--navy);font-size:12px;font-weight:700;background:none;cursor:pointer;transition:all .15s;}
.rules-tab.active{background:var(--navy);color:var(--white);}
.rules-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;display:none;}
.rules-card.active{display:block;}
.rules-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.rules-card-title{font-size:15px;font-weight:700;color:var(--navy);}
.rules-edit-btn{padding:4px 12px;background:#e0e4f0;color:var(--navy);border:none;border-radius:5px;font-size:11px;font-weight:700;cursor:pointer;display:none;}
.rules-edit-btn.show{display:block;}
.rules-content{font-size:13px;line-height:1.9;white-space:pre-wrap;color:var(--text);}
.rules-edit-area{display:none;flex-direction:column;gap:8px;}
.rules-edit-area.show{display:flex;}
.rules-title-inp{width:100%;padding:7px 10px;border:1.5px solid var(--navy);border-radius:6px;font-size:14px;font-weight:700;font-family:'Noto Sans KR',sans-serif;}
.rules-body-ta{width:100%;padding:8px 10px;border:1.5px solid var(--navy);border-radius:6px;font-size:13px;font-family:'Noto Sans KR',sans-serif;resize:vertical;min-height:200px;line-height:1.9;}
.rules-edit-actions{display:flex;gap:6px;justify-content:flex-end;}
.rules-save-btn{padding:6px 14px;background:var(--navy);color:var(--white);border:none;border-radius:5px;font-size:11px;font-weight:700;cursor:pointer;}
.rules-cancel-btn{padding:6px 10px;background:var(--bg);color:var(--text2);border:none;border-radius:5px;font-size:11px;cursor:pointer;}

/* BOARD */
.board-page{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:640px){.board-page{grid-template-columns:1fr;}}
.board-col{display:flex;flex-direction:column;gap:10px;}
.board-section{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.board-section-header{background:var(--navy);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;}
.board-section-header.gold{background:var(--gold);}
.board-section-title{font-size:13px;font-weight:700;color:var(--white);}
.board-section-header.gold .board-section-title{color:var(--navy-dark);}
.write-btn-sm{padding:4px 10px;background:rgba(255,255,255,.2);color:var(--white);border:1px solid rgba(255,255,255,.4);border-radius:5px;font-size:11px;font-weight:700;cursor:pointer;}
.board-section-header.gold .write-btn-sm{background:rgba(26,42,94,.15);color:var(--navy-dark);border-color:rgba(26,42,94,.3);}
.post-list-inner{padding:8px;}
.post-item{padding:9px 10px;border-radius:7px;border:1px solid transparent;margin-bottom:4px;transition:all .15s;}
.post-item:hover{background:#f0f2f8;border-color:var(--border);}
.post-title-sm{font-size:12px;font-weight:700;color:var(--text);cursor:pointer;}
.post-meta-sm{font-size:10px;color:var(--text2);margin-top:2px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.post-badge{font-size:9px;padding:1px 6px;border-radius:8px;font-weight:700;background:#e0e4f0;color:var(--navy);}
.empty-msg{font-size:12px;color:var(--text2);padding:16px;text-align:center;}
.post-actions{display:none;gap:4px;margin-left:auto;}
.post-actions.show{display:flex;}
.act-btn{padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;cursor:pointer;border:none;}
.act-edit{background:#e0e4f0;color:var(--navy);}.act-del{background:#fee2e2;color:#991b1b;}
.info-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.info-card-header{padding:10px 14px;display:flex;align-items:center;gap:8px;justify-content:space-between;}
.info-card-header.safety{background:#fef3c7;}.info-card-header.award{background:#dcfce7;}.info-card-header.emergency{background:#fee2e2;}
.info-header-left{display:flex;align-items:center;gap:8px;}
.info-icon{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.info-icon.safety{background:#f59e0b;}.info-icon.award{background:#16a34a;}.info-icon.emergency{background:#dc2626;}
.info-card-title{font-size:13px;font-weight:700;}
.info-card-title.safety{color:#92400e;}.info-card-title.award{color:#14532d;}.info-card-title.emergency{color:#991b1b;}
.info-edit-btn{padding:3px 9px;border-radius:5px;font-size:10px;font-weight:700;cursor:pointer;border:none;display:none;}
.info-edit-btn.safety{background:#fde68a;color:#92400e;}.info-edit-btn.award{background:#bbf7d0;color:#14532d;}.info-edit-btn.emergency{background:#fecaca;color:#991b1b;}
.info-edit-btn.show{display:block;}
.info-body{padding:12px 14px;}
.info-item{display:flex;gap:8px;margin-bottom:7px;font-size:12px;line-height:1.7;}
.info-item:last-child{margin-bottom:0;}
.info-bullet{width:18px;height:18px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;margin-top:1px;}
.info-bullet.safety{background:#fde68a;color:#92400e;}.info-bullet.award{background:#bbf7d0;color:#14532d;}.info-bullet.emergency{background:#fecaca;color:#991b1b;}
.award-table{width:100%;border-collapse:collapse;font-size:12px;}
.award-table th{background:#f0f9f4;color:#14532d;padding:6px 10px;text-align:left;font-weight:700;border-bottom:1px solid #d1fae5;}
.award-table td{padding:6px 10px;border-bottom:1px solid var(--border);}
.award-table tr:last-child td{border-bottom:none;}
.info-edit-area{display:none;padding:10px 14px;border-top:1px solid var(--border);background:#f8f9fc;}
.info-edit-area.show{display:block;}
.info-edit-area textarea{width:100%;padding:8px 10px;border:1.5px solid var(--navy);border-radius:6px;font-size:12px;font-family:'Noto Sans KR',sans-serif;resize:vertical;min-height:100px;line-height:1.7;}
.info-edit-area .edit-actions{display:flex;gap:6px;justify-content:flex-end;margin-top:6px;}
.info-edit-area .btn-save{padding:6px 14px;background:var(--navy);color:var(--white);border:none;border-radius:5px;font-size:11px;font-weight:700;cursor:pointer;}
.info-edit-area .btn-cancel-sm{padding:6px 10px;background:var(--bg);color:var(--text2);border:none;border-radius:5px;font-size:11px;cursor:pointer;}
.info-edit-area .hint{font-size:10px;color:var(--text2);margin-bottom:6px;}

/* MODAL */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center;padding:16px;}
.modal-bg.show{display:flex;}
.modal{background:var(--card);border-radius:12px;padding:22px;max-width:440px;width:100%;max-height:90vh;overflow-y:auto;}
.modal h2{font-size:15px;font-weight:700;color:var(--navy);margin-bottom:12px;}
.modal input,.modal textarea,.modal select{width:100%;padding:7px 10px;border:1.5px solid var(--border);border-radius:6px;font-size:13px;font-family:'Noto Sans KR',sans-serif;margin-bottom:9px;}
.modal input:focus,.modal textarea:focus{outline:none;border-color:var(--navy);}
.modal label{font-size:11px;color:var(--text2);display:block;margin-bottom:3px;font-weight:600;}
.modal-btns{display:flex;gap:7px;justify-content:flex-end;margin-top:4px;}
.modal-btns button{padding:7px 14px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;border:none;}
.btn-cancel{background:var(--bg);color:var(--text);}
.btn-confirm{background:var(--navy);color:var(--white);}
.btn-danger{background:#fee2e2;color:#991b1b;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:var(--white);padding:9px 18px;border-radius:8px;font-size:12px;font-weight:700;z-index:300;display:none;}
</style>
</head>
<body>

<div class="top-nav">
  <div class="logo-area">
    <div class="logo-badge">HS</div>
    <div class="logo-text">한수컵 2026<span>HANSU MIDDLE SCHOOL</span></div>
  </div>
  <div class="nav-tabs">
    <button class="nav-tab active" onclick="showPage('home',this)">🏠 홈</button>
    <button class="nav-tab" onclick="showPage('bracket1',this)">⚽ 1학년</button>
    <button class="nav-tab" onclick="showPage('bracket2',this)">🤾 2학년</button>
    <button class="nav-tab" onclick="showPage('bracket3',this)">🏐 3학년</button>
    <button class="nav-tab" onclick="showPage('rules',this)">📋 경기 요강</button>
    <button class="nav-tab" onclick="showPage('board',this)">📢 게시판</button>
  </div>
  <button class="admin-btn" id="adminToggleBtn" onclick="openAdminModal()">🔒 관리자</button>
</div>

<div class="page active" id="page-home"></div>
<div class="page" id="page-bracket1"></div>
<div class="page" id="page-bracket2"></div>

// 파이어베이스 클라우드에 전체 통합 데이터 업로드/저장 함수
window.saveToFirebase = async function() {
  try {
    await setDoc(doc(db, "hansu_cup", "mainData"), {
      schedules: window.schedules,
      board: window.board,
      rulesData: window.rulesData,
      adminPass: window.currentAdminPin // 보안 규칙 통과용 비번 동봉
    });
    showToast('서버에 실시간 동기화 완료!');
  } catch (e) {
    console.error(e);
    showToast('🛑 저장 실패! 비밀번호 권한이 없습니다.');
  }
};

// 파이어베이스 클라우드를 실시간 감시하여 데이터 변동 시 화면 자동 새로고침 함수
function listenToFirebase() {
  onSnapshot(doc(db, "hansu_cup", "mainData"), (docSnap) => {
    if (docSnap.exists()) {
      const serverData = docSnap.data();
      if (serverData.schedules) window.schedules = serverData.schedules;
      if (serverData.board) window.board = serverData.board;
      if (serverData.rulesData) window.rulesData = serverData.rulesData;
      
      // 화면 컴포넌트 실시간 재렌더링
      renderHome();
      renderBoard();
      renderRulesCard();
      [1, 2, 3].forEach(g => {
        const c = document.getElementById('page-bracket' + g);
        if (c && c.innerHTML.trim()) renderBracket(g);
      });
      console.log("Firebase와 완벽하게 동기화되었습니다.");
    } else {
      // 서버에 데이터가 비어있을 경우 초기 샘플 빌드업
      initSampleData();
      window.saveToFirebase();
    }
  });
}

<script>
function openAdminModal(){
  if(window.isAdmin){
    window.isAdmin=false; window.currentAdminPin="";
    document.body.classList.remove('admin-mode');
    const btn=document.getElementById('adminToggleBtn');
    btn.classList.remove('active-admin'); btn.textContent='🔒 관리자';
    updateAdminInfoBtns();
    [1,2,3].forEach(g=>{ const c=document.getElementById('page-bracket'+g); if(c&&c.innerHTML.trim())renderBracket(g); });
    renderBoard(); renderHome();
    if(document.getElementById('page-rules').classList.contains('active'))renderRulesCard();
    showToast('관리자 모드 해제');
  } else {
    document.getElementById('adminPin').value='';
    document.getElementById('adminModal').classList.add('show');
    document.getElementById('adminPin').focus();
  }
}
function closeModal(id){document.getElementById(id).classList.remove('show');}
function showPage(name,btn){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  btn.classList.add('active');
  if(['bracket1','bracket2','bracket3'].includes(name)) {
    window.currentGrade = +name.slice(-1);
    renderBracket(window.currentGrade);
  }
  if(name==='home')renderHome();
  if(name==='board')renderBoard();
  if(name==='rules')renderRulesCard();
}
function goGrade(g){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach((t,i)=>{
    t.classList.remove('active'); if(i===g)t.classList.add('active');
  });
  document.getElementById('page-bracket'+g).classList.add('active');
  window.currentGrade = g;
  renderBracket(g);
}
function showToast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.style.display='block';
  clearTimeout(t._t); t._t=setTimeout(()=>{t.style.display='none'},2500);
}
function updateAdminInfoBtns(){
  const d = window.isAdmin?'block':'none';
  document.getElementById('noticeWriteBtn').style.display=d;
  ['safety','award','emergency'].forEach(k=>{
    const b=document.getElementById('editBtn-'+k); if(b)b.style.display=window.isAdmin?'block':'none';
  });
}

/* HOME RENDER */
function renderHome(){
  let totalGames=0, playingGames=0, doneGames=0;
  let allEvs = [];
  window.schedules.forEach(s=>{
    s.games.forEach(r=>{
      r.list.forEach(g=>{
        totalGames++;
        if(g.status==='playing')playingGames++;
        if(g.status==='done')doneGames++;
      });
    });
    s.calendar.forEach(e=>{ allEvs.push({grade:s.grade, sport:s.sport, ...e}); });
  });

  let h = `
    <div class="hero">
      <div class="hero-title">한수컵 2026</div>
      <div class="hero-sub">한수중학교 학년별 스포츠 리그 스포츠 클럽 시스템</div>
      <div class="hero-meta">
        <div class="hero-badge">⚽ 1학년 풋살</div><div class="hero-badge">🤾 2학년 츄크볼</div><div class="hero-badge">🏐 3학년 배구</div>
      </div>
    </div>
    <div class="summary-grid">
      <div class="summary-card"><div class="num">${totalGames}</div><div class="lbl">총 경기수</div></div>
      <div class="summary-card"><div class="num" style="color:var(--gold);">${playingGames}</div><div class="lbl">진행중 경기</div></div>
      <div class="summary-card"><div class="num" style="color:var(--win);">${doneGames}</div><div class="lbl">종료된 경기</div></div>
    </div>
    <div class="section-title">📅 한수컵 대회 일정 달력</div>
    <div class="cal-wrap">
      <div class="cal-header">
        <button class="cal-nav-btn" onclick="navCal(-1)">◀</button>
        <div class="cal-month-title">${calCurrentYear} . ${String(calCurrentMonth).padStart(2,'0')}</div>
        <button class="cal-nav-btn" onclick="navCal(1)">▶</button>
        <button class="cal-add-btn ${window.isAdmin?'show':''}" onclick="openCalAddModal()">+ 일정추가</button>
      </div>
      <div class="cal-grid-header">
        <div class="cal-day-name">일</div><div class="cal-day-name">월</div><div class="cal-day-name">화</div>
        <div class="cal-day-name">수</div><div class="cal-day-name">목</div><div class="cal-day-name">금</div>
        <div class="cal-day-name">토</div>
      </div>
      <div class="cal-grid">
  `;

  let first = new Date(calCurrentYear, calCurrentMonth-1, 1);
  let startDay = first.getDay();
  let last = new Date(calCurrentYear, calCurrentMonth, 0);
  let totalDays = last.getDate();

  for(let i=0; i<startDay; i++) h += `<div class="cal-cell empty"></div>`;
  
  let today = new Date();
  for(let d=1; d<=totalDays; d++){
    let isToday = (today.getFullYear()===calCurrentYear && today.getMonth()===calCurrentMonth-1 && today.getDate()===d);
    let cellDay = (startDay + d - 1) % 7;
    let cls = 'cal-cell';
    if(isToday) cls += ' today';
    if(cellDay===0) cls += ' sunday';
    if(cellDay===6) cls += ' saturday';

    let dateStr = `${calCurrentYear}-${String(calCurrentMonth).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    let dayEvs = allEvs.filter(e=>e.date===dateStr);

    h += `<div class="cal-cell ${cls}"><div class="cal-date">${d}</div>`;
    dayEvs.forEach(ev=>{
      h += `
        <div class="cal-event ${ev.type}" onclick="viewCalEvent('${ev.id}')" title="${ev.title} (${ev.note})">
          ${ev.title}
          <button class="ev-del" onclick="event.stopPropagation(); delCalEvent('${ev.id}')">×</button>
        </div>
      `;
    });
    h += `</div>`;
  }
  
  let endEmpty = (7 - ((startDay + totalDays) % 7)) % 7;
  for(let i=0; i<endEmpty; i++) h += `<div class="cal-cell empty"></div>`;

  h += `
      </div>
      <div class="cal-legend">
        <div class="leg-item"><div class="leg-dot ev-futsal"></div>1학년 풋살</div>
        <div class="leg-item"><div class="leg-dot ev-tchouk"></div>2학년 츄크볼</div>
        <div class="leg-item"><div class="leg-dot ev-volleyball"></div>3학년 배구</div>
        <div class="leg-item"><div class="leg-dot ev-special"></div>특별 행사</div>
        <div class="leg-item"><div class="leg-dot ev-general"></div>일반 일정</div>
      </div>
    </div>
  `;
  document.getElementById('page-home').innerHTML = h;
}
function navCal(v){
  calCurrentMonth += v;
  if(calCurrentMonth>12){ calCurrentMonth=1; calCurrentYear++; }
  if(calCurrentMonth<1) { calCurrentMonth=12; calCurrentYear--; }
  renderHome();
}
function openCalAddModal(){

function saveCalEvent(){
  const date=document.getElementById('ceDate').value;
  const title=document.getElementById('ceTitle').value.trim();
  const type=document.getElementById('ceType').value;
  const note=document.getElementById('ceNote').value.trim();
  if(!date||!title){alert('날짜와 제목을 작성해주세요.');return;}

  if(type==='ev-tchouk')targetGrade=2;
  if(type==='ev-volleyball')targetGrade=3;
  let s = window.schedules.find(x=>x.grade===targetGrade) || window.schedules[0];

function delCalEvent(id){

          <table class="sched-table">
            <thead><tr><th>일시/시간</th><th>장소</th><th>매치업 팀</th><th>스코어</th><th>상태</th>${window.isAdmin?'<th>관리</th>':''}</tr></thead>

function saveScheduleGame(){
  const g=+document.getElementById('sgGrade').value;
  const rIdx=+document.getElementById('sgRoundIdx').value;
  const gIdx=+document.getElementById('sgGameIdx').value;
  const rName=document.getElementById('sgRoundName').value;
  const s=window.schedules.find(x=>x.grade===g);

  if(rIdx===-1){
    s.games.push({ roundName:rName, collapsed:false, status:'scheduled', list:[] });
  } else {
    let r=s.games[rIdx];
    let gmData={
      id: gIdx===-1?'g-'+Date.now():r.list[gIdx].id,
      date: document.getElementById('sgDate').value||'5월 20일',
      time: document.getElementById('sgTime').value||'12:40',
      venue: document.getElementById('sgVenue').value||'운동장',
      home: document.getElementById('sgHome').value||'무명',
      away: document.getElementById('sgAway').value||'무명',
      status: document.getElementById('sgStatus').value,
      homeScore: gIdx===-1?0:r.list[gIdx].homeScore,
      awayScore: gIdx===-1?0:r.list[gIdx].awayScore
    };
    if(gIdx===-1) r.list.push(gmData); else r.list[gIdx]=gmData;
  }
  closeModal('scheduleGameModal');
  window.saveToFirebase();
}
function delScheduleGame(g,rIdx,gIdx){
  if(!confirm('해당 매치 일정을 삭제하시겠습니까?'))return;
  window.schedules.find(x=>x.grade===g).games[rIdx].list.splice(gIdx,1);

    document.getElementById('postField2').readOnly=false;
  }
  document.getElementById('writeModal')._type = type;
}
function submitPost(){
  const type = document.getElementById('writeModal')._type;
  const f1 = document.getElementById('postField1').value.trim();
  const f2 = document.getElementById('postField2').value.trim();
  const f3 = document.getElementById('postField3').value;
  if(!f1||!f2||!f3){alert('모든 필드를 입력해 주세요.');return;}

  let d = new Date(); let dStr = `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  if(type==='notice'){
    window.board.notices.unshift({ title:f1, author:f2, body:f3, date:dStr });
  } else {
    window.board.students.unshift({ title:f1, gradeClass:f2, author:'익명', body:f3, date:dStr });
  }
  closeModal('writeModal');
  window.saveToFirebase();
}
function openEditPostModal(type,idx){
  event.stopPropagation();
  const p = type==='notice'?window.board.notices[idx]:window.board.students[idx];
  document.getElementById('editPostModal').classList.add('show');
  document.getElementById('editPostId').value=idx; document.getElementById('editPostType').value=type;
  if(type==='notice'){
    document.getElementById('editLabelField1').textContent='공지 제목'; document.getElementById('editLabelField2').textContent='작성자';
    document.getElementById('editLabelField3').textContent='공지 내용';
    document.getElementById('editPostField1').value=p.title; document.getElementById('editPostField2').value=p.author;
  } else {
    document.getElementById('editLabelField1').textContent='글 제목'; document.getElementById('editLabelField2').textContent='학년반';
    document.getElementById('editLabelField3').textContent='내용';
    document.getElementById('editPostField1').value=p.title; document.getElementById('editPostField2').value=p.gradeClass;
  }
  document.getElementById('editPostField3').value=p.body;
}
function saveEditPost(){
  const idx = +document.getElementById('editPostId').value;
  const type = document.getElementById('editPostType').value;
  const p = type==='notice'?window.board.notices[idx]:window.board.students[idx];
  p.title = document.getElementById('editPostField1').value.trim();
  if(type==='notice') p.author = document.getElementById('editPostField2').value.trim();
  else p.gradeClass = document.getElementById('editPostField2').value.trim();
  p.body = document.getElementById('editPostField3').value;
  closeModal('editPostModal');
  window.saveToFirebase();
}
function delPost(type,idx){
  event.stopPropagation(); if(!confirm('이 게시글을 삭제하시겠습니까?'))return;
  if(type==='notice') window.board.notices.splice(idx,1); else window.board.students.splice(idx,1);
  window.saveToFirebase();
}
function viewPost(type,idx){
  const p = type==='notice'?window.board.notices[idx]:window.board.students[idx];
  document.getElementById('pvTitle').textContent = type==='notice'?'📌 교사 공지사항':'💬 학생 게시판';
  document.getElementById('pvMeta').textContent = type==='notice'?`작성: ${p.author} | 일시: ${p.date}`:`소속: ${p.gradeClass} | 일시: ${p.date}`;
  document.getElementById('pvBody').textContent = `제목: ${p.title}\n\n${p.body}`;
  document.getElementById('postViewModal').classList.add('show');
}
function toggleInfoEdit(key){
  document.getElementById('editArea-'+key).classList.toggle('show');
  document.getElementById('editText-'+key).value = window.board[key];
}
function cancelInfoEdit(key){document.getElementById('editArea-'+key).classList.remove('show');}
function saveInfoEdit(key){
  window.board[key] = document.getElementById('editText-'+key).value;
  cancelInfoEdit(key);
  window.saveToFirebase();
}

// 빌드인 로딩 핸들러
window.addEventListener('DOMContentLoaded',()=>{ renderHome(); renderBoard(); renderRulesCard(); });
</script>
